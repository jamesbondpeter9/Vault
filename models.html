<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Models - Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .nav-bar-compact {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2px;
            margin-bottom: 20px;
            max-width: 1700px;
            margin-left: auto;
            margin-right: auto;
        }
        .mondrian-nav-box {
            height: 52px !important;
            font-size: 0.85rem !important;
            border-radius: 12px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: #fff;
            border: 1px solid var(--card-border);
            text-decoration: none;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .mondrian-nav-box:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }
        .models-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-auto-rows: 180px;
            grid-auto-flow: dense;
            gap: 4px;
            align-items: stretch;
        }
        @media(max-width: 1400px) { .models-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media(max-width: 900px) { .models-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media(max-width: 500px) { .models-grid { grid-template-columns: 1fr; } }

        .mondrian-card {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 12px;
            text-decoration: none;
            background: #000;
            display: block;
            box-sizing: border-box;
        }
        .mondrian-card.portrait { grid-column: span 1; grid-row: span 2; }
        .mondrian-card.landscape { grid-column: span 2; grid-row: span 2; }
        .mondrian-card.square { grid-column: span 1; grid-row: span 1; }

        .mondrian-thumb {
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }
        .mondrian-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="site-container">
        <div class="nav-bar-compact">
            <a href="index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="video-gallery.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Gallery Hub</div></a>
        </div>

        <div style="margin-bottom: 24px; display: flex; gap: 10px; align-items: center;">
            <input type="text" id="modelNameInput" placeholder="Model Name" style="flex: 1; padding: 12px; background: var(--card-bg); border: 1px solid var(--card-border); color: #fff; border-radius: 12px;">
            <input type="text" id="modelThumbInput" placeholder="Thumbnail URL" style="flex: 2; padding: 12px; background: var(--card-bg); border: 1px solid var(--card-border); color: #fff; border-radius: 12px;">
            <button onclick="addNewModel()" class="btn-primary" style="padding: 12px 24px;">Add Model</button>
        </div>

        <div class="models-grid" id="modelsGrid"></div>
    </div>

    <script src="storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();
            renderModels();
        });

        function renderModels() {
            const models = StorageDB.getModels();
            const grid = document.getElementById('modelsGrid');
            
            if (models.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 4; text-align: center; color: var(--text-muted); padding: 60px;">No models added yet.</div>`;
                return;
            }

            grid.innerHTML = '';
            models.forEach((model) => {
                const card = document.createElement('div');
                card.className = `mondrian-card ${model.shape || 'portrait'} ${model.shape === 'landscape' ? 'landscape' : 'portrait'}`;
                
                card.innerHTML = `
                    <div class="mondrian-thumb">
                        ${model.thumbnail ? `<img src="${model.thumbnail}" alt="${model.name}">` : '<div style="color:#888;">No Image</div>'}
                        <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 22px 10px 8px 10px; background: transparent; font-weight: 700; font-size: 0.85rem; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.9); z-index: 5; display: flex; justify-content: space-between; align-items: center;">
                            <a href="videotag.html?name=${encodeURIComponent(model.name)}" style="color: #fff; text-decoration: none; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${model.name}</a>
                            <button onclick="deleteModel('${model.name.replace(/'/g, "\\'")}')" style="background: rgba(255,0,0,0.7); border: none; color: #fff; border-radius: 50%; width: 24px; height: 24px; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-left: 8px;" title="Delete Model">&times;</button>
                        </div>
                    </div>`;
                grid.appendChild(card);
            });
        }

        function addNewModel() {
            const nameInput = document.getElementById('modelNameInput');
            const thumbInput = document.getElementById('modelThumbInput');
            const name = nameInput.value.trim();
            const thumbnail = thumbInput.value.trim();

            if (!name) {
                alert('Please enter a model name.');
                return;
            }

            StorageDB.addModel({ name, thumbnail, shape: 'portrait' });
            nameInput.value = '';
            thumbInput.value = '';
            renderModels();
        }

        function deleteModel(modelName) {
            if (!confirm(`Are you sure you want to delete model "${modelName}"?`)) return;
            let models = StorageDB.getModels();
            models = models.filter(m => m.name.toLowerCase() !== modelName.toLowerCase());
            StorageDB.saveModels(models);
            renderModels();
        }
    </script>
</body>
</html>
