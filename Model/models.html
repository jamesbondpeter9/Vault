<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Authentication Guard -->
    <script>
        if (sessionStorage.getItem('portal_authenticated') !== 'true') {
            alert('Access Denied: Please log in first.');
            window.location.href = '../login.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Models Directory - Portal</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .nav-bar-compact {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2px;
            margin-bottom: 20px;
        }
        @media(max-width: 900px) { .nav-bar-compact { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media(max-width: 500px) { .nav-bar-compact { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

        .mondrian-nav-box {
            height: 52px !important;
            font-size: 0.85rem !important;
            border-radius: 12px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: #fff;
            border: 1px solid var(--card-border);
            text-decoration: none;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .mondrian-nav-box:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; justify-content: center; }
        .filter-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 0.8rem; transition: all 0.2s ease; }
        .filter-btn:hover, .filter-btn.active { background: #fff; color: #000; border-color: #fff; }
        
        .models-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-auto-rows: 320px;
            grid-auto-flow: dense;
            gap: 4px;
            align-items: stretch;
        }
        @media(max-width: 1400px) { .models-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media(max-width: 900px) { .models-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media(max-width: 500px) { 
            .models-grid { 
                grid-template-columns: 1fr; 
                grid-auto-rows: auto;
                gap: 2px;
            } 
            .mondrian-card.landscape,
            .mondrian-card.portrait,
            .mondrian-card.square {
                grid-column: span 1 !important;
                grid-row: span 1 !important;
                height: auto !important;
                aspect-ratio: auto !important;
            }
            .mondrian-thumb {
                aspect-ratio: 4 / 5;
            }
            .mondrian-thumb img {
                object-fit: cover !important;
            }
        }

        .mondrian-card.landscape { grid-column: span 2; grid-row: span 1; }
        .mondrian-card.portrait { grid-column: span 1; grid-row: span 2; }
        .mondrian-card.square { grid-column: span 1; grid-row: span 1; }

        .mondrian-thumb {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            cursor: pointer;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        /* High quality mobile rendering compatibility without compression */
        .mondrian-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            position: absolute;
            inset: 0;
            image-rendering: -webkit-optimize-contrast;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        .update-thumb-btn { 
            position: absolute; top: 10px; left: 10px; 
            background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.3); 
            color: #fff; width: 26px; height: 26px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 0.9rem; font-weight: bold; cursor: pointer; 
            opacity: 0; transition: opacity 0.2s ease; z-index: 20; 
        }
        .mondrian-thumb:hover .update-thumb-btn { opacity: 1; }
        @media(max-width: 500px) { .update-thumb-btn { opacity: 0.8; } }

        .delete-btn { 
            position: absolute; top: 10px; right: 10px; 
            background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.3); 
            color: #ff4d4d; width: 26px; height: 26px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 0.9rem; font-weight: bold; cursor: pointer; 
            opacity: 0; transition: opacity 0.2s ease; z-index: 20; 
        }
        .mondrian-thumb:hover .delete-btn { opacity: 1; }
        @media(max-width: 500px) { .delete-btn { opacity: 0.8; } }
    </style>
</head>
<body>
    <div class="site-container">
        <div class="nav-bar-compact">
            <a href="../index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="javascript:void(0)" onclick="openAddModelModal()" class="mondrian-nav-card"><div class="mondrian-nav-box" style="font-size: 1.3rem; font-weight: 900;">+</div></a>
        </div>

        <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 24px;">Models Directory</h1>

        <div class="filter-bar" id="filterBar"></div>
        <div class="models-grid" id="modelsGrid"><div style="grid-column: span 4; text-align: center; color: var(--text-muted); padding: 60px;">No models found.</div></div>

        <div id="paginationBar" style="display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 30px; margin-bottom: 40px;"></div>

        <div id="modelModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); align-items:center; justify-content:center; z-index:100;">
            <div class="control-panel" style="width: 100%; max-width: 400px; position:relative;">
                <h3 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 16px;">Add New Model</h3>
                <form id="modelForm">
                    <div style="margin-bottom: 14px;">
                        <label style="display:block; font-size:0.8rem; color:var(--text-muted); margin-bottom:4px;">Model Name</label>
                        <input type="text" id="modelName" required="" placeholder="Enter model name">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label style="display:block; font-size:0.8rem; color:var(--text-muted); margin-bottom:4px;">Photo / Thumbnail URL</label>
                        <input type="text" id="modelThumb" required="" placeholder="https://...">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button type="submit" class="btn-primary" style="flex:1;">Save Model</button>
                        <button type="button" onclick="closeAddModelModal()" class="btn-primary" style="background:#333; color:#fff; flex:1;">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="updateThumbModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); align-items:center; justify-content:center; z-index:100;">
            <div class="control-panel" style="width: 100%; max-width: 400px; position:relative;">
                <h3 style="font-size: 1.2rem; font-weight: 700; margin-bottom: 16px;">Update Thumbnail Image</h3>
                <form id="updateThumbForm">
                    <div style="margin-bottom: 20px;">
                        <label style="display:block; font-size:0.8rem; color:var(--text-muted); margin-bottom:4px;">New Thumbnail URL</label>
                        <input type="text" id="newThumbUrl" required="" placeholder="https://...">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button type="submit" class="btn-primary" style="flex:1;">Update</button>
                        <button type="button" onclick="closeUpdateThumbModal()" class="btn-primary" style="background:#333; color:#fff; flex:1;">Cancel</button>
                    </div>
                </form>
            </div>
        </div>

        <div id="deleteModal" style="display:none; position: fixed; inset: 0px; background: rgba(0, 0, 0, 0.85); align-items: center; justify-content: center; z-index: 100;">
            <div class="control-panel" style="width: 100%; max-width: 350px; text-align: center;">
                <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 10px;">Delete Model</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">Are you sure you want to remove this model from the directory?</p>
                <div style="display: flex; gap: 10px;">
                    <button onclick="confirmDeleteModel()" class="btn-primary" style="flex:1; background:#ff4d4d; color:#fff;">Delete</button>
                    <button onclick="closeDeleteModal()" class="btn-primary" style="flex:1; background:#333; color:#fff;">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script references pointing to Modelstorage.js -->
    <script src="../config.js"></script>
    <script src="Modelstorage.js"></script>
    <script src="../github-sync.js"></script>
    <script>
        let currentLetterFilter = 'ALL';
        let currentPage = 1;
        const pageSize = 20;
        let modelIndexToDelete = null;
        let modelIndexToUpdateThumb = null;

        document.addEventListener('DOMContentLoaded', async () => {
            // Ensure database initializes and remote sync completes BEFORE rendering elements
            if (typeof ModelStorageDB !== 'undefined') {
                await ModelStorageDB.initDB();
            }

            buildFilterBar();
            renderModels();

            // Auto-generate name from thumbnail URL as user types/pastes
            const thumbField = document.getElementById('modelThumb');
            if (thumbField) {
                thumbField.addEventListener('input', () => {
                    const urlVal = thumbField.value.trim();
                    if (!urlVal) return;
                    try {
                        const cleanUrl = urlVal.split('?')[0].split('#')[0];
                        const segments = cleanUrl.split('/');
                        let filename = segments[segments.length - 1];
                        if (filename.includes('.')) {
                            filename = filename.substring(0, filename.lastIndexOf('.'));
                        }
                        if (filename) {
                            // Replace hyphens and underscores with spaces (supports First-Name, First-Middle-Last, etc.)
                            const formattedName = filename.replace(/[-_]/g, ' ');
                            document.getElementById('modelName').value = formattedName;
                        }
                    } catch (err) {}
                });
            }

            document.getElementById('modelForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const nameInput = document.getElementById('modelName');
                const thumbInput = document.getElementById('modelThumb');
                const name = nameInput.value.trim();
                const thumb = thumbInput.value.trim();
                if (!name || !thumb) return;

                const img = new Image();
                img.src = thumb;
                img.onload = () => {
                    const shape = img.height > img.width ? 'portrait' : (img.width > img.height ? 'landscape' : 'square');
                    saveModel(name, thumb, shape);
                };
                img.onerror = () => {
                    saveModel(name, thumb, 'square');
                };
            });

            document.getElementById('updateThumbForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const newUrl = document.getElementById('newThumbUrl').value.trim();
                if (modelIndexToUpdateThumb !== null && newUrl) {
                    const img = new Image();
                    img.src = newUrl;
                    img.onload = () => {
                        const shape = img.height > img.width ? 'portrait' : (img.width > img.height ? 'landscape' : 'square');
                        updateModelThumb(modelIndexToUpdateThumb, newUrl, shape);
                    };
                    img.onerror = () => {
                        updateModelThumb(modelIndexToUpdateThumb, newUrl, 'square');
                    };
                }
                closeUpdateThumbModal();
            });
        });

        async function saveModel(name, thumbnail, shape) {
            const modelData = { name, thumbnail, shape, createdAt: Date.now() };

            if (typeof ModelStorageDB !== 'undefined') {
                await ModelStorageDB.addModel(modelData);
            }

            document.getElementById('modelName').value = '';
            document.getElementById('modelThumb').value = '';
            closeAddModelModal();
            currentPage = 1;
            renderModels();
        }

        async function updateModelThumb(index, newUrl, shape) {
            if (typeof ModelStorageDB !== 'undefined') {
                const models = ModelStorageDB.getModels() || [];
                if (models[index]) {
                    models[index].thumbnail = newUrl;
                    models[index].shape = shape;
                    await ModelStorageDB.saveAndSyncModels(models, true);
                }
            }

            renderModels();
        }

        function buildFilterBar() {
            const filterBar = document.getElementById('filterBar');
            const letters = ['ALL', ...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
            filterBar.innerHTML = '';
            letters.forEach(letter => {
                const btn = document.createElement('button');
                btn.className = `filter-btn ${letter === 'ALL' ? 'active' : ''}`;
                btn.textContent = letter;
                btn.onclick = () => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentLetterFilter = letter;
                    currentPage = 1;
                    renderModels();
                };
                filterBar.appendChild(btn);
            });
        }

        function renderModels() {
            if (typeof ModelStorageDB === 'undefined') return;
            const models = ModelStorageDB.getModels() || [];
            const grid = document.getElementById('modelsGrid');
            const paginationBar = document.getElementById('paginationBar');
            
            const modelsWithIndex = models.map((m, idx) => ({ ...m, originalIndex: idx }));
            const filtered = modelsWithIndex.filter(m => {
                if (currentLetterFilter === 'ALL') return true;
                return m.name.toUpperCase().startsWith(currentLetterFilter);
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 4; text-align: center; color: var(--text-muted); padding: 60px;">No models found.</div>`;
                paginationBar.innerHTML = '';
                return;
            }

            const totalPages = Math.ceil(filtered.length / pageSize);
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * pageSize;
            const endIndex = startIndex + pageSize;
            const paginatedItems = filtered.slice(startIndex, endIndex);

            grid.innerHTML = '';
            paginatedItems.forEach((model) => {
                const card = document.createElement('div');
                const shape = model.shape || (model.originalIndex % 2 === 0 ? 'portrait' : 'landscape');
                card.className = `mondrian-card ${shape}`;

                card.innerHTML = `
                    <div class="mondrian-thumb" onclick="openAlbums('${encodeURIComponent(model.name)}')">
                        <button type="button" class="update-thumb-btn" onclick="event.stopPropagation(); openUpdateThumbModal(${model.originalIndex})" title="Update thumbnail">+</button>
                        <button type="button" class="delete-btn" onclick="event.stopPropagation(); openDeleteModal(${model.originalIndex})" title="Delete model">&times;</button>
                        ${model.thumbnail ? `<img src="${model.thumbnail}" alt="${model.name}">` : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;">No Photo</div>'}
                        <div style="position: absolute; bottom: 0; left: 0; width: 100%; padding: 14px 16px; font-weight: 700; font-size: 0.85rem; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.9); z-index: 5;">${model.name}</div>
                    </div>`;
                grid.appendChild(card);
            });

            paginationBar.innerHTML = '';
            if (totalPages > 1) {
                const prevBtn = document.createElement('button');
                prevBtn.className = 'filter-btn';
                prevBtn.textContent = '← Prev';
                prevBtn.disabled = currentPage === 1;
                prevBtn.style.opacity = currentPage === 1 ? '0.4' : '1';
                prevBtn.onclick = () => {
                    if (currentPage > 1) {
                        currentPage--;
                        renderModels();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                };
                paginationBar.appendChild(prevBtn);

                const pageInfo = document.createElement('span');
                pageInfo.style.color = 'var(--text-muted)';
                pageInfo.style.fontSize = '0.85rem';
                pageInfo.style.fontWeight = '700';
                pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
                paginationBar.appendChild(pageInfo);

                const nextBtn = document.createElement('button');
                nextBtn.className = 'filter-btn';
                nextBtn.textContent = 'Next →';
                nextBtn.disabled = currentPage === totalPages;
                nextBtn.style.opacity = currentPage === totalPages ? '0.4' : '1';
                nextBtn.onclick = () => {
                    if (currentPage < totalPages) {
                        currentPage++;
                        renderModels();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                };
                paginationBar.appendChild(nextBtn);
            }
        }

        function openAlbums(name) {
            window.location.href = `vault.html?name=${name}`;
        }

        function openUpdateThumbModal(index) {
            modelIndexToUpdateThumb = index;
            document.getElementById('newThumbUrl').value = '';
            document.getElementById('updateThumbModal').style.display = 'flex';
        }

        function closeUpdateThumbModal() {
            modelIndexToUpdateThumb = null;
            document.getElementById('updateThumbModal').style.display = 'none';
        }

        function openDeleteModal(index) {
            modelIndexToDelete = index;
            document.getElementById('deleteModal').style.display = 'flex';
        }

        function closeDeleteModal() {
            modelIndexToDelete = null;
            document.getElementById('deleteModal').style.display = 'none';
        }

        async function confirmDeleteModel() {
            if (modelIndexToDelete !== null && typeof ModelStorageDB !== 'undefined') {
                const models = ModelStorageDB.getModels() || [];
                const targetModel = models[modelIndexToDelete];
                
                if (targetModel) {
                    await ModelStorageDB.deleteModel(targetModel.name);
                }
                renderModels();
            }
            closeDeleteModal();
        }

        function openAddModelModal() { document.getElementById('modelModal').style.display = 'flex'; }
        function closeAddModelModal() { document.getElementById('modelModal').style.display = 'none'; }
    </script>
</body>
</html>
