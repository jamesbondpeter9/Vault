<!DOCTYPE html>
<html lang="en"><head>
    <!-- Authentication Guard -->
    <script>
        if (sessionStorage.getItem('portal_authenticated') !== 'true') {
            alert('Access Denied: Please log in first.');
            window.location.href = 'login.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery Hub - Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="site-container">
        <div class="nav-bar-compact">
            <a href="photostream.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Photostream</div></a>
            <a href="albums.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Albums</div></a>
        </div>
        
        <div style="max-width: 600px; margin: 60px auto; text-align: center;">
            <div class="control-panel">
                <button onclick="downloadUpdatedImageGallery()" class="btn-primary" style="width: 100%; padding: 18px; font-size: 1rem;">Download Updated image-gallery.html</button>
            </div>
        </div>

        <script type="application/json" id="embedded-images-database">{
  "models": [],
  "photostreams": [],
  "folders": []
}</script>
    </div>

    <script src="config.js"></script>
    <script src="images-storage.js"></script>
    <script src="github-sync.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await ImageStorageDB.initDB();
            try {
                const embeddedScript = document.getElementById('embedded-images-database');
                if (embeddedScript) {
                    const dbData = JSON.parse(embeddedScript.textContent);
                    if (dbData) {
                        if (dbData.models && dbData.models.length > 0) await ImageStorageDB.saveModels(dbData.models);
                        if (dbData.photostreams && dbData.photostreams.length > 0) await ImageStorageDB.savePhotoStreams(dbData.photostreams);
                        if (dbData.folders && dbData.folders.length > 0) await ImageStorageDB.saveFolders(dbData.folders);
                    }
                }
            } catch (e) {}

            // Trigger real-time background sync on load to keep images.json updated automatically
            await GitHubSync.triggerAutoSync();
        });

        async function downloadUpdatedImageGallery() {
            await ImageStorageDB.initDB();
            const models = await ImageStorageDB.getModels() || [];
            const photostreams = await ImageStorageDB.getPhotoStreams() || [];
            const folders = await ImageStorageDB.getFolders() || [];

            const dbPayload = {
                models: models,
                photostreams: photostreams,
                folders: folders
            };

            const htmlContent = `<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        if (sessionStorage.getItem('portal_authenticated') !== 'true') {
            alert('Access Denied: Please log in first.');
            window.location.href = 'login.html';
        }
    <\/script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery Hub - Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="site-container">
        <div class="nav-bar-compact">
            <a href="photostream.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Photostream</div></a>
            <a href="albums.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Albums</div></a>
        </div>
        
        <div style="max-width: 600px; margin: 60px auto; text-align: center;">
            <div class="control-panel">
                <button onclick="downloadUpdatedImageGallery()" class="btn-primary" style="width: 100%; padding: 18px; font-size: 1rem;">Download Updated image-gallery.html</button>
            </div>
        </div>

        <script type="application/json" id="embedded-images-database">
        ${JSON.stringify(dbPayload, null, 8)}
        <\/script>
    </div>

    <script src="config.js"><\/script>
    <script src="images-storage.js"><\/script>
    <script src="github-sync.js"><\/script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await ImageStorageDB.initDB();
            try {
                const embeddedScript = document.getElementById('embedded-images-database');
                if (embeddedScript) {
                    const dbData = JSON.parse(embeddedScript.textContent);
                    if (dbData) {
                        if (dbData.models && dbData.models.length > 0) await ImageStorageDB.saveModels(dbData.models);
                        if (dbData.photostreams && dbData.photostreams.length > 0) await ImageStorageDB.savePhotoStreams(dbData.photostreams);
                        if (dbData.folders && dbData.folders.length > 0) await ImageStorageDB.saveFolders(dbData.folders);
                    }
                }
            } catch (e) {}

            await GitHubSync.triggerAutoSync();
        });

        async function downloadUpdatedImageGallery() {
            location.reload();
        }
    <\/script>
</body>
</html>`;

            await GitHubSync.triggerAutoSync();

            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'image-gallery.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body></html>
