<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Authentication Guard -->
    <script>
        if (sessionStorage.getItem('portal_authenticated') !== 'true') {
            alert('Access Denied: Please log in first.');
            window.location.href = '../login.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Streams - Portal</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .nav-bar-compact {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2px;
            margin-bottom: 24px;
            max-width: 1650px;
            margin-left: auto;
            margin-right: auto;
        }
        .mondrian-nav-box {
            height: 52px !important;
            font-size: 0.85rem !important;
            border-radius: 12px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: #fff;
            border: 1px solid var(--card-border);
            text-decoration: none;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
        }
        .streams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            max-width: 1650px;
            margin: 0 auto;
        }
        .stream-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            color: #fff;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .stream-card:hover {
            transform: translateY(-4px);
            border-color: #fff;
        }
        .stream-thumb {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background: #000;
        }
        .stream-card-title {
            padding: 12px 16px;
            font-size: 0.9rem;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="site-container">
        <div class="nav-bar-compact">
            <a href="../index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="../models.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Models</div></a>
        </div>

        <h1 id="tagHeaderTitle" style="font-size: 1.5rem; font-weight: 800; margin-bottom: 20px; text-align: center;">Model Streams</h1>
        
        <div class="streams-grid" id="streamsGrid">
            <div style="color: var(--text-muted); text-align: center; grid-column: 1 / -1;">Loading streams...</div>
        </div>
    </div>

    <!-- Script imports relative to root -->
    <script src="../config.js"></script>
    <script src="storage.js"></script>
    <script src="../github-sync.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();
            const params = new URLSearchParams(window.location.search);
            const modelName = params.get('model');

            const header = document.getElementById('tagHeaderTitle');
            const grid = document.getElementById('streamsGrid');

            if (!modelName) {
                header.textContent = 'All Streams';
                renderStreams(StorageDB.getStreams());
                return;
            }

            header.textContent = `Streams tagged with "${modelName}"`;
            const allStreams = StorageDB.getStreams();
            const filteredStreams = allStreams.filter(s => 
                s.models && s.models.some(m => m.toLowerCase() === modelName.toLowerCase())
            );

            renderStreams(filteredStreams);
        });

        function renderStreams(streams) {
            const grid = document.getElementById('streamsGrid');
            if (!streams || streams.length === 0) {
                grid.innerHTML = `<div style="color: var(--text-muted); text-align: center; grid-column: 1 / -1;">No streams found.</div>`;
                return;
            }

            grid.innerHTML = streams.map((stream, idx) => `
                <a href="watch.html?index=${idx}" class="stream-card">
                    <img src="${stream.thumbnail || 'placeholder.jpg'}" class="stream-thumb" alt="${stream.title}" onerror="this.src='placeholder.jpg'">
                    <div class="stream-card-title">${stream.title}</div>
                </a>
            `).join('');
        }
    </script>
</body>
</html>
