<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Authentication Guard -->
    <script>
        if (sessionStorage.getItem('portal_authenticated') !== 'true') {
            alert('Access Denied: Please log in first.');
            window.location.href = '../login.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Stream - Portal</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .nav-bar-compact {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2px;
            margin-bottom: 2px; /* 2px gap between nav and stream info/content area */
            max-width: 1300px;
            margin-left: auto;
            margin-right: auto;
        }
        .mondrian-nav-box {
            height: 50px !important;
            font-size: 0.85rem !important;
            border-radius: 12px !important;
        }
        .watch-container {
            max-width: 1300px;
            margin: 0 auto;
        }
        .player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            box-shadow: 0 25px 50px rgba(0,0,0,0.95), var(--neon-glow);
            margin-bottom: 20px;
        }
        .player-wrapper iframe, .player-wrapper video {
            width: 100%;
            height: 100%;
            border: none;
        }
        .stream-info-panel {
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), var(--neon-glow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* Model+ Button Styling */
        .model-plus-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .model-plus-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #fff;
        }

        /* Mobile Responsive Adjustments */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            .site-container {
                width: 100%;
                padding: 0;
            }
            .stream-info-panel {
                padding: 16px;
                flex-direction: column;
                align-items: flex-start;
            }
            .nav-bar-compact {
                margin-bottom: 2px;
            }
            .player-wrapper {
                border-radius: 12px;
                margin-bottom: 12px;
            }
            h1#streamTitle {
                font-size: 1.1rem !important;
            }
        }
    </style>
</head>
<body>
    <div class="site-container">
        <div class="nav-bar-compact">
            <a href="../index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <div class="mondrian-nav-card" onclick="openDeleteStreamModal()" style="cursor: pointer;">
                <div class="mondrian-nav-box" style="color: #ff4d4d; font-size: 1.1rem; font-weight: 900;" title="Delete Stream">&times;</div>
            </div>
        </div>

        <div class="watch-container">
            <div class="player-wrapper" id="playerContainer">
                <div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;">Loading player...</div>
            </div>
            <div class="stream-info-panel">
                <div style="flex: 1; min-width: 250px;">
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap;">
                        <h1 id="streamTitle" style="font-size: 1.3rem; font-weight: 800; margin: 0;">Loading stream...</h1>
                        <button onclick="openAddTitleModal()" style="background: rgba(255,255,255,0.1); border: 1px solid var(--card-border); color: #fff; padding: 4px 10px; border-radius: 14px; font-size: 0.7rem; font-weight: 700; cursor: pointer; transition: all 0.2s ease;" title="Edit Title">addTitle</button>
                    </div>
                    <div id="modelTags" style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;"></div>
                </div>
                <div>
                    <button class="model-plus-btn" onclick="openModelPlusModal()">Model+</button>
                </div>
            </div>
        </div>

        <!-- Delete Stream Modal -->
        <div id="deleteModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); align-items:center; justify-content:center; z-index:100;">
            <div class="control-panel" style="width: 100%; max-width: 350px; text-align: center;">
                <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 10px;">Delete Stream</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px;">Are you sure you want to remove this stream from your portal?</p>
                <div style="display: flex; gap: 10px;">
                    <button onclick="confirmDeleteStream()" id="confirmDeleteBtn" class="btn-primary" style="flex:1; background:#ff4d4d; color:#fff;">Delete</button>
                    <button onclick="closeDeleteModal()" class="btn-primary" style="flex:1; background:#333; color:#fff;">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Add/Edit Stream Title Modal -->
        <div id="addTitleModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); align-items:center; justify-content:center; z-index:100;">
            <div class="control-panel" style="width: 100%; max-width: 400px; text-align: left; background: var(--card-bg); padding: 24px; border-radius: 20px; border: 1px solid var(--card-border);">
                <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 6px;">Update Stream Title</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 16px;">Enter a new title for this stream:</p>
                <div style="margin-bottom: 20px;">
                    <input type="text" id="streamTitleInput" style="width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--card-border); background: rgba(0,0,0,0.2); color: #fff; font-size: 0.9rem; outline: none; box-sizing: border-box;" placeholder="Stream title..." onkeydown="if(event.key==='Enter'){saveStreamTitle();}">
                </div>
                <div style="display: flex; gap: 10px;">
                    <button onclick="saveStreamTitle()" class="btn-primary" style="flex:1; background: var(--accent-color, #4f46e5); color:#fff; padding: 10px; border-radius: 10px; border: none; cursor:pointer; font-weight:600;">Save</button>
                    <button onclick="closeAddTitleModal()" class="btn-primary" style="flex:1; background:#333; color:#fff; padding: 10px; border-radius: 10px; border: none; cursor:pointer; font-weight:600;">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Model+ Interactive Modal for Adding and Updating Models from models.html -->
        <div id="modelPlusModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); align-items:center; justify-content:center; z-index:100;">
            <div class="control-panel" style="width: 100%; max-width: 440px; text-align: left; background: var(--card-bg); padding: 24px; border-radius: 20px; border: 1px solid var(--card-border);">
                <h3 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 6px;">Model+ Tagging Manager</h3>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 16px;">Manage model tags or pick from models.html:</p>
                
                <!-- Active Model Badges list inside Modal -->
                <div id="modalModelTagsList" style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; max-height: 120px; overflow-y: auto; padding: 4px;"></div>

                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <select id="modelsHtmlSelect" style="flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--card-border); background: rgba(0,0,0,0.2); color: #fff; font-size: 0.9rem; outline: none;">
                        <option value="">-- Select model from models.html --</option>
                    </select>
                    <button onclick="addModelFromDropdown()" class="btn-primary" style="background: rgba(255,255,255,0.15); border: 1px solid var(--card-border); color: #fff; padding: 0 16px; border-radius: 10px; cursor: pointer; font-weight: 600;">Add</button>
                </div>

                <div style="display: flex; gap: 8px; margin-bottom: 20px;">
                    <input type="text" id="newModelInput" style="flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--card-border); background: rgba(0,0,0,0.2); color: #fff; font-size: 0.9rem; outline: none;" placeholder="Or type custom model name..." onkeydown="if(event.key==='Enter'){addModelTagFromInput();}">
                    <button onclick="addModelTagFromInput()" class="btn-primary" style="background: rgba(255,255,255,0.15); border: 1px solid var(--card-border); color: #fff; padding: 0 16px; border-radius: 10px; cursor: pointer; font-weight: 600;">Add</button>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button onclick="saveModelTags()" class="btn-primary" style="flex:1; background: var(--accent-color, #4f46e5); color:#fff; padding: 10px; border-radius: 10px; border: none; cursor:pointer; font-weight:600;">Save Changes</button>
                    <button onclick="closeModelPlusModal()" class="btn-primary" style="flex:1; background:#333; color:#fff; padding: 10px; border-radius: 10px; border: none; cursor:pointer; font-weight:600;">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../config.js"></script>
    <script src="storage.js"></script>
    <script src="player.js"></script>
    <script src="../github-sync.js"></script>
    <script>
        let streamIndex = 0;
        let currentStreamItem = null;
        let allStreamsRef = [];
        let editingModelsList = [];
        let availableModelsFromHtml = [];

        document.addEventListener('DOMContentLoaded', async () => {
            // Initialize storage DB (fetches videos.json directly from Media/ folder)
            if (typeof StorageDB !== 'undefined' && typeof StorageDB.initDB === 'function') {
                await StorageDB.initDB();
            }

            // Preload models from Model/models.html
            loadModelsFromHtmlFile();

            const params = new URLSearchParams(window.location.search);
            streamIndex = parseInt(params.get('index') ?? '0', 10);
            
            let streams = (typeof StorageDB !== 'undefined' && typeof StorageDB.getVideoStreams === 'function') 
                ? StorageDB.getVideoStreams() 
                : ((typeof StorageDB !== 'undefined' && typeof StorageDB.getStreams === 'function') ? StorageDB.getStreams() : []);
            
            if (!streams || streams.length === 0) {
                try {
                    const rawLocal = localStorage.getItem('video_portal_streams_db') || localStorage.getItem('portal_videos');
                    if (rawLocal) {
                        const parsed = JSON.parse(rawLocal);
                        streams = Array.isArray(parsed) ? parsed : (parsed.streams || parsed.videos || []);
                    }
                } catch (e) {}
            }
            
            allStreamsRef = streams;
            currentStreamItem = streams[streamIndex];
            
            if (!currentStreamItem) {
                document.getElementById('playerContainer').innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#ff4d4d;font-weight:700;">Stream not found or has been removed.</div>`;
                document.getElementById('streamTitle').textContent = 'Stream Not Found';
                return;
            }

            document.title = `${currentStreamItem.title} - Video Portal`;
            document.getElementById('streamTitle').textContent = currentStreamItem.title;

            renderModelTags();

            // Initialize player using player.js inside Media/ folder
            if (typeof VideoPlayer !== 'undefined' && typeof VideoPlayer.init === 'function') {
                VideoPlayer.init('playerContainer', currentStreamItem);
            } else {
                const playerContainer = document.getElementById('playerContainer');
                let embedHtml = '';
                const url = currentStreamItem.url || '';

                if (url.includes('youtube.com') || url.includes('youtu.be')) {
                    let ytId = '';
                    if (url.includes('embed/')) ytId = url.split('embed/')[1].split('?')[0];
                    else if (url.includes('watch?v=')) ytId = url.split('watch?v=')[1].split('&')[0];
                    else if (url.includes('youtu.be/')) ytId = url.split('youtu.be/')[1].split('?')[0];
                    
                    if (ytId) {
                        embedHtml = `<iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
                    }
                } else if (url.match(/\.(mp4|webm|ogg|mov)(\?.*)?$/i) || url.includes('.m3u8')) {
                    embedHtml = `<video src="${url}" controls autoplay playsinline webkit-playsinline style="width:100%;height:100%;object-fit:contain;"></video>`;
                } else {
                    embedHtml = `<iframe src="${url}" allowfullscreen></iframe>`;
                }
                playerContainer.innerHTML = embedHtml;
            }
        });

        async function loadModelsFromHtmlFile() {
            try {
                const response = await fetch('../Model/models.html');
                if (!response.ok) return;
                const htmlText = await response.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                
                // Extract model names from list items, buttons, headings, or data attributes inside models.html
                const extracted = new Set();
                doc.querySelectorAll('li, .model-item, [data-model], h3, h4, .card-title').forEach(el => {
                    const text = el.textContent.trim();
                    if (text && text.length < 50 && !text.toLowerCase().includes('model+')) {
                        extracted.add(text);
                    }
                });

                availableModelsFromHtml = Array.from(extracted);
                const selectEl = document.getElementById('modelsHtmlSelect');
                if (selectEl && availableModelsFromHtml.length > 0) {
                    selectEl.innerHTML = '<option value="">-- Select model from models.html --</option>';
                    availableModelsFromHtml.forEach(modelName => {
                        const opt = document.createElement('option');
                        opt.value = modelName;
                        opt.textContent = modelName;
                        selectEl.appendChild(opt);
                    });
                }
            } catch (e) {
                console.warn('Could not load models.html from Model folder:', e);
            }
        }

        function renderModelTags() {
            const tagsContainer = document.getElementById('modelTags');
            tagsContainer.innerHTML = '';
            
            // Render Model+ button directly adjacent to model tags with exact same styling and sizing
            const modelPlusInlineBtn = document.createElement('button');
            modelPlusInlineBtn.className = 'model-plus-btn';
            modelPlusInlineBtn.style.cssText = 'background: rgba(255,255,255,0.15); border: 1px solid var(--card-border); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 750; cursor: pointer; transition: all 0.2s ease;';
            modelPlusInlineBtn.textContent = 'Model+';
            modelPlusInlineBtn.onclick = openModelPlusModal;
            tagsContainer.appendChild(modelPlusInlineBtn);

            if (currentStreamItem.models && currentStreamItem.models.length > 0) {
                currentStreamItem.models.forEach(modelName => {
                    const tag = document.createElement('span');
                    tag.style.cssText = 'background: rgba(255,255,255,0.1); border: 1px solid var(--card-border); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 750;';
                    tag.textContent = modelName;
                    tagsContainer.appendChild(tag);
                });
            }
        }

        function openAddTitleModal() {
            if (!currentStreamItem) return;
            document.getElementById('streamTitleInput').value = currentStreamItem.title || '';
            document.getElementById('addTitleModal').style.display = 'flex';
            document.getElementById('streamTitleInput').focus();
        }

        function closeAddTitleModal() {
            document.getElementById('addTitleModal').style.display = 'none';
        }

        async function saveStreamTitle() {
            if (!currentStreamItem) return;
            const newTitle = document.getElementById('streamTitleInput').value.trim();
            if (!newTitle) {
                alert('Title cannot be empty.');
                return;
            }

            currentStreamItem.title = newTitle;
            document.getElementById('streamTitle').textContent = newTitle;
            document.title = `${newTitle} - Video Portal`;

            if (allStreamsRef.length > 0) {
                allStreamsRef[streamIndex] = currentStreamItem;
                try {
                    if (typeof StorageDB !== 'undefined' && typeof StorageDB.saveStreams === 'function') {
                        await StorageDB.saveStreams(allStreamsRef);
                    } else {
                        localStorage.setItem('video_portal_streams_db', JSON.stringify(allStreamsRef));
                    }
                } catch (e) {
                    console.error('Error saving updated title to storage:', e);
                }
            }
            closeAddTitleModal();
        }

        function openModelPlusModal() {
            if (!currentStreamItem) return;
            editingModelsList = [...(currentStreamItem.models || [])];
            renderModalModelTagsList();
            document.getElementById('newModelInput').value = '';
            document.getElementById('modelPlusModal').style.display = 'flex';
        }

        function closeModelPlusModal() {
            document.getElementById('modelPlusModal').style.display = 'none';
        }

        function renderModalModelTagsList() {
            const listContainer = document.getElementById('modalModelTagsList');
            listContainer.innerHTML = '';
            if (editingModelsList.length === 0) {
                listContainer.innerHTML = '<span style="color: var(--text-muted); font-size: 0.8rem;">No models added yet.</span>';
                return;
            }
            editingModelsList.forEach((model, idx) => {
                const chip = document.createElement('div');
                chip.style.cssText = 'display: inline-flex; align-items: center; background: rgba(255,255,255,0.15); border: 1px solid var(--card-border); color: #fff; padding: 4px 10px; border-radius: 16px; font-size: 0.75rem; font-weight: 600; gap: 6px;';
                chip.innerHTML = `<span>${model}</span> <span style="cursor: pointer; color: #ff4d4d; font-weight: bold;" onclick="removeEditingModel(${idx})" title="Remove">&times;</span>`;
                listContainer.appendChild(chip);
            });
        }

        function addModelFromDropdown() {
            const selectEl = document.getElementById('modelsHtmlSelect');
            const val = selectEl.value;
            if (!val) return;
            if (!editingModelsList.includes(val)) {
                editingModelsList.push(val);
                renderModalModelTagsList();
            }
            selectEl.value = '';
        }

        function addModelTagFromInput() {
            const inputField = document.getElementById('newModelInput');
            const val = inputField.value.trim();
            if (!val) return;
            const splitVals = val.split(',').map(m => m.trim()).filter(m => m.length > 0);
            splitVals.forEach(m => {
                if (!editingModelsList.includes(m)) {
                    editingModelsList.push(m);
                }
            });
            inputField.value = '';
            renderModalModelTagsList();
        }

        function removeEditingModel(index) {
            editingModelsList.splice(index, 1);
            renderModalModelTagsList();
        }

        async function saveModelTags() {
            if (!currentStreamItem) return;
            
            currentStreamItem.models = [...editingModelsList];
            
            if (allStreamsRef.length > 0) {
                allStreamsRef[streamIndex] = currentStreamItem;
                try {
                    if (typeof StorageDB !== 'undefined' && typeof StorageDB.saveStreams === 'function') {
                        await StorageDB.saveStreams(allStreamsRef);
                    } else {
                        localStorage.setItem('video_portal_streams_db', JSON.stringify(allStreamsRef));
                    }
                } catch (e) {
                    console.error('Error saving model tags to storage:', e);
                }
            }

            renderModelTags();
            closeModelPlusModal();
        }

        function openDeleteStreamModal() {
            document.getElementById('deleteModal').style.display = 'flex';
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
        }

        async function confirmDeleteStream() {
            if (streamIndex === undefined || streamIndex < 0) return;
            
            const deleteBtn = document.getElementById('confirmDeleteBtn');
            deleteBtn.disabled = true;
            deleteBtn.textContent = 'Deleting...';

            const syncSuccess = await StorageDB.deleteStream(streamIndex);

            if (syncSuccess) {
                window.location.href = '../index.html';
            } else {
                deleteBtn.disabled = false;
                deleteBtn.textContent = 'Delete';
                console.error('GitHub Sync failed during stream deletion.');
                alert('Stream removed locally, but GitHub sync failed! Check your browser console for details.');
            }
        }
    </script>
</body>
</html>
