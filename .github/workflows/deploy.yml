name: Portal Sync & Deploy

on:
  push:
    branches: [main, master]
    paths:
      # Watch specific core data and media management files/folders as requested
      - 'model.html'
      - 'photostream.html'
      - 'stream.html'
      - 'watch.html'
      - 'view.html'
      - 'videotag.html'
      
  workflow_dispatch: # Allows manual triggers anytime from the Actions tab

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Portal Files
        run: |
          echo "Changes detected in core portal files. Running deployment..."
          git status
