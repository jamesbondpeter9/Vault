name: Auto-update videos.json from video-gallery.html

on:
  push:
    paths:
      - 'video-gallery.html'

# Prevents mid-flight task cancellations and queues updates safely
concurrency:
  group: gallery-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-json-from-gallery:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Extract JSON and update videos.json
        run: |
          node -e '
          const fs = require("fs");
          if (!fs.existsSync("video-gallery.html")) {
              console.log("video-gallery.html not found, skipping sync.");
              process.exit(0);
          }
          const htmlContent = fs.readFileSync("video-gallery.html", "utf8");
          const match = htmlContent.match(/<script type="application\/json" id="embedded-database">([\s\S]*?)<\/script>/i);
          if (!match) {
              console.error("Embedded database script tag not found!");
              process.exit(1);
          }
          try {
              const jsonData = JSON.parse(match[1].trim());
              fs.writeFileSync("videos.json", JSON.stringify(jsonData, null, 4), "utf8");
              console.log("Successfully updated videos.json from video-gallery.html!");
          } catch(err) {
              console.error("Invalid JSON inside embedded-database script tag:", err);
              process.exit(1);
          }
          '

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update videos.json from Gallery Hub [skip ci]"
          file_pattern: "videos.json"
