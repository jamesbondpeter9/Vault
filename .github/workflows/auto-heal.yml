name: Portal Sync & Deploy

on:
  push:
    branches: [main, master]
    paths:
      - '**.html'
      - '**.js'
      - 'scripts/**'
      - 'models.json'
      - 'videos.json'
  workflow_dispatch: # Allows you to trigger it manually anytime from the Actions tab

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Portal Files
        run: |
          echo "Processing updated HTML and JS files..."
          git status

      - name: Deploy to Pages / Repository
        run: |
          echo "Portal sync complete!"
