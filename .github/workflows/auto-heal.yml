name: Auto-Heal Failed or Cancelled Sync

on:
  workflow_run:
    workflows: 
      - "pages-build-deployment"
      - "Portal Sync & Deploy"
    types:
      - completed

concurrency:
  group: auto-heal-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  actions: write

jobs:
  retry-if-failed:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' }}
    steps:
      - name: Trigger Re-run with Delay and Limit
        uses: actions/github-script@v6
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const runName = context.payload.workflow_run.name;
            const attempt = context.payload.workflow_run.run_attempt;
            
            console.log(`Workflow "${runName}" (ID: ${runId}) finished with conclusion: ${context.payload.workflow_run.conclusion}. Current attempt: ${attempt}`);
            
            if (attempt >= 5) {
              console.log(`❌ Maximum retry limit of 5 reached for this run. Stopping auto-heal to prevent infinite loops.`);
              return;
            }
            
            console.log(`⏳ Waiting 1 minute (60 seconds) before triggering re-run to space out workflow queues...`);
            await new Promise(resolve => setTimeout(resolve, 60000));
            
            console.log(`🔄 Automatically re-running (Attempt ${attempt + 1} of 5)...`);
            await github.rest.actions.reRunWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });
