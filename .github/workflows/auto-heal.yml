name: Auto-Heal Failed or Cancelled Sync

on:
  workflow_run:
    workflows: 
      - "pages-build-deployment" # Targets the official GitHub Pages build and deploy runner
      - "Portal Sync & Deploy"    # Keep your custom sync workflow here too if you use one
    types:
      - completed

permissions:
  actions: write

jobs:
  retry-if-failed:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' }}
    steps:
      - name: Trigger Re-run
        uses: actions/github-script@v6
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const runName = context.payload.workflow_run.name;
            console.log(`Pages workflow "${runName}" (ID: ${runId}) finished with conclusion: ${context.payload.workflow_run.conclusion}. Automatically re-running...`);
            
            await github.rest.actions.reRunWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });
