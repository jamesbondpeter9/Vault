name: Update Images JSON Database

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'imagess.json'
      - 'scripts/update-images-json.js'

jobs:
  validate-and-update-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Image Database Validation Script
        run: node scripts/update-images-json.js

      - name: Commit and push changes if any
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated schema sync for imagess.json [skip ci]"
          file_pattern: "imagess.json"
