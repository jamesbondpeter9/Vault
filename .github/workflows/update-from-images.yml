name: Auto-update images.json from image-gallery.html

on:
  push:
    paths:
      - 'image-gallery.html'

concurrency:
  group: image-gallery-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-json-from-image-gallery:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Extract JSON and update images.json
        run: |
          node -e '
          const fs = require("fs");
          if (!fs.existsSync("image-gallery.html")) {
              console.log("image-gallery.html not found, skipping sync.");
              process.exit(0);
          }
          const htmlContent = fs.readFileSync("image-gallery.html", "utf8");
          const match = htmlContent.match(/<script type="application\/json" id="embedded-images-database">([\s\S]*?)<\/script>/i);
          if (!match) {
              console.error("Embedded images database script tag not found!");
              process.exit(1);
          }
          try {
              const jsonData = JSON.parse(match[1].trim());
              if (jsonData.photostreams) {
                  jsonData.photostreams = jsonData.photostreams.filter(item => {
                      const t = (item.type || "photo").toLowerCase();
                      return t === "photo" || t === "photostream";
                  });
              }
              fs.writeFileSync("images.json", JSON.stringify(jsonData, null, 4), "utf8");
              console.log("Successfully updated and filtered images.json from image-gallery.html!");
          } catch(err) {
              console.error("Invalid JSON inside embedded-images-database script tag:", err);
              process.exit(1);
          }
          '

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update images.json from Image Gallery Hub [skip ci]"
          file_pattern: "images.json"
