<script src="config.js"></script>
<script>
    // Execute immediately without waiting for DOMContentLoaded if elements might load later,
    // but wrap element bindings safely.
    window.addEventListener('DOMContentLoaded', () => {
        // Clear previous state on login page to prevent loops
        sessionStorage.removeItem('portal_authenticated');
        try { localStorage.removeItem('portal_authenticated'); } catch (e) {}

        const loginForm = document.getElementById('loginForm');
        if (!loginForm) return;

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const usernameElem = document.getElementById('usernameInput');
            const passwordElem = document.getElementById('passwordInput');
            const tokenElem = document.getElementById('tokenInput');

            const username = usernameElem ? usernameElem.value.trim() : '';
            const password = passwordElem ? passwordElem.value : '';
            const token = tokenElem ? tokenElem.value.trim() : '';
            
            const correctUsername = (typeof PortalConfig !== 'undefined' && PortalConfig.username) ? PortalConfig.username : 'Janice';
            const correctPassword = (typeof PortalConfig !== 'undefined' && PortalConfig.password) ? PortalConfig.password : 'James@123';

            if (username === correctUsername && password === correctPassword) {
                sessionStorage.setItem('portal_authenticated', 'true');
                try {
                    localStorage.setItem('portal_authenticated', 'true');
                } catch (err) {}

                if (token) {
                    const cleanToken = token.trim();
                    sessionStorage.setItem('github_token', cleanToken);
                    sessionStorage.setItem('github_pat', cleanToken);
                    try {
                        localStorage.setItem('github_token', cleanToken);
                        localStorage.setItem('github_pat', cleanToken);
                    } catch (err) {}
                    
                    if (typeof setGitHubToken === 'function') {
                        setGitHubToken(cleanToken);
                    }
                }

                window.location.href = 'index.html';
            } else {
                const errorMsg = document.getElementById('errorMsg');
                if (errorMsg) errorMsg.style.display = 'block';
            }
        });
    });
</script>
