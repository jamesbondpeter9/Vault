<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #000;
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 30px;
            background: var(--card-bg, #111);
            border: 1px solid var(--card-border, #333);
            border-radius: 16px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .login-card h2 {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
        }
        .login-card label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted, #888);
            margin-bottom: 6px;
            font-weight: 700;
        }
        .login-card input {
            width: 100%;
            padding: 12px 14px;
            background: #000;
            border: 1px solid var(--card-border, #333);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            box-sizing: border-box;
            margin-bottom: 16px;
            font-family: inherit;
        }
        .login-card input:focus {
            outline: none;
            border-color: #fff;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.2s ease;
            margin-top: 4px;
        }
        .login-btn:hover {
            opacity: 0.9;
        }
        .error-msg {
            color: #ff4d4d;
            font-size: 0.8rem;
            text-align: center;
            margin-top: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Portal Login</h2>
        <form id="loginForm">
            <div>
                <label>Username</label>
                <input type="text" id="usernameInput" required placeholder="Janice">
            </div>
            <div>
                <label>Password</label>
                <input type="password" id="usernameInput" required placeholder="James@123">
            </div>
            <button type="submit" class="login-btn">Log In</button>
            <div id="errorMsg" class="error-msg">Incorrect username or password. Please try again.</div>
        </form>
    </div>

    <script src="config.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('usernameInput').value;
            
            // Set your desired credentials here or map them from PortalConfig
            const correctUsername = (typeof PortalConfig !== 'undefined' && PortalConfig.username) ? PortalConfig.username : 'admin';
            const correctPassword = (typeof PortalConfig !== 'undefined' && PortalConfig.password) ? PortalConfig.password : 'admin';

            if (username === correctUsername && password === correctPassword) {
                sessionStorage.setItem('portal_authenticated', 'true');
                window.location.href = 'index.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
