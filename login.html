<script src="config.js"></script>
<script>
    // Auto-fill token field if previously stored in normal mode
    document.addEventListener('DOMContentLoaded', () => {
        const storedToken = localStorage.getItem('github_token') || sessionStorage.getItem('github_token');
        if (storedToken) {
            document.getElementById('tokenInput').value = storedToken;
        }
    });

    document.getElementById('loginForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const username = document.getElementById('usernameInput').value.trim();
        const password = document.getElementById('passwordInput').value;
        const token = document.getElementById('tokenInput').value.trim();
        
        const correctUsername = (typeof PortalConfig !== 'undefined' && PortalConfig.username) ? PortalConfig.username : 'Janice';
        const correctPassword = (typeof PortalConfig !== 'undefined' && PortalConfig.password) ? PortalConfig.password : 'James@123';

        if (username === correctUsername && password === correctPassword) {
            // Save authentication status in both storages
            sessionStorage.setItem('portal_authenticated', 'true');
            try {
                localStorage.setItem('portal_authenticated', 'true');
            } catch (err) {}

            // Save GitHub PAT token everywhere possible
            if (token) {
                const cleanToken = token.trim();
                sessionStorage.setItem('github_token', cleanToken);
                sessionStorage.setItem('github_pat', cleanToken);
                try {
                    localStorage.setItem('github_token', cleanToken);
                    localStorage.setItem('github_pat', cleanToken);
                } catch (err) {
                    console.warn('localStorage restricted (likely Incognito mode). Using sessionStorage & memory cache.');
                }
                
                // Also update via helper if available
                if (typeof setGitHubToken === 'function') {
                    setGitHubToken(cleanToken);
                }
            }

            // Redirect to portal
            window.location.href = 'index.html';
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    });
</script>
