<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Hub - Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="site-container">
        <div class="nav-bar-compact">
            <a href="index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="stream.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="font-size: 1.4rem; font-weight: 900;">+</div></a>
        </div>
        
        <div style="max-width: 600px; margin: 60px auto; text-align: center;">
            <div class="control-panel">
                <button onclick="downloadUpdatedGallery()" class="btn-primary" style="width: 100%; padding: 18px; font-size: 1rem;">Download Updated video-gallery.html</button>
            </div>
        </div>

        <script type="application/json" id="embedded-database">
        {
            "models": [],
            "streams": [],
            "homepage_thumbnails": []
        }
        </script>
    </div>

    <script src="storage.js"></script>
    <script>
        async function downloadUpdatedGallery() {
            await StorageDB.initDB();
            const models = StorageDB.getModels();
            const streams = StorageDB.getVideoStreams();

            const dbPayload = {
                models: models,
                streams: streams,
                homepage_thumbnails: []
            };

            const htmlContent = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery Hub - Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="site-container">
        <div class="nav-bar-compact">
            <a href="index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="stream.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="font-size: 1.4rem; font-weight: 900;">+</div></a>
        </div>
        
        <div style="max-width: 600px; margin: 60px auto; text-align: center;">
            <div class="control-panel">
                <button onclick="downloadUpdatedGallery()" class="btn-primary" style="width: 100%; padding: 18px; font-size: 1rem;">Download Updated video-gallery.html</button>
            </div>
        </div>

        <script type="application/json" id="embedded-database">
        ${JSON.stringify(dbPayload, null, 8)}
        <\/script>
    </div>

    <script src="storage.js"><\/script>
    <script>
        async function downloadUpdatedGallery() {
            location.reload();
        }
    <\/script>
</body>
</html>`;

            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'video-gallery.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
