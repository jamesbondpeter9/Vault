<!DOCTYPE html>
<html lang="en"><head>
    <!-- Authentication Guard -->
    <script>
        if (sessionStorage.getItem('portal_authenticated') !== 'true') {
            alert('Access Denied: Please log in first.');
            window.location.href = 'login.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Gallery Hub - Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="site-container">
        <div class="nav-bar-compact">
            <a href="index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="models.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Models</div></a>
        </div>
        
        <div style="max-width: 600px; margin: 60px auto; text-align: center;">
            <div class="control-panel">
                <button onclick="downloadUpdatedVideoGallery()" class="btn-primary" style="width: 100%; padding: 18px; font-size: 1rem;">Download Updated video-gallery.html</button>
            </div>
        </div>

        <script type="application/json" id="embedded-video-database">{
  "models": [],
  "streams": []
}</script>
    </div>

    <script src="config.js"></script>
    <script src="storage.js"></script>
    <script src="github-sync.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();
            try {
                const embeddedScript = document.getElementById('embedded-video-database');
                if (embeddedScript) {
                    const dbData = JSON.parse(embeddedScript.textContent);
                    if (dbData) {
                        // Fully sync and overwrite local storage with embedded payload to purge deleted models/streams
                        if (dbData.models) StorageDB.saveModels(dbData.models);
                        if (dbData.streams) StorageDB.saveVideoStreams(dbData.streams);
                    }
                }
            } catch (e) {}
        });

        async function downloadUpdatedVideoGallery() {
            await StorageDB.initDB();
            const models = StorageDB.getModels() || [];
            const streams = StorageDB.getVideoStreams() || [];

            const dbPayload = {
                models: models,
                streams: streams
            };

            const htmlContent = `<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        if (sessionStorage.getItem('portal_authenticated') !== 'true') {
            alert('Access Denied: Please log in first.');
            window.location.href = 'login.html';
        }
    <\/script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Gallery Hub - Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="site-container">
        <div class="nav-bar-compact">
            <a href="index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="models.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Models</div></a>
        </div>
        
        <div style="max-width: 600px; margin: 60px auto; text-align: center;">
            <div class="control-panel">
                <button onclick="downloadUpdatedVideoGallery()" class="btn-primary" style="width: 100%; padding: 18px; font-size: 1rem;">Download Updated video-gallery.html</button>
            </div>
        </div>

        <script type="application/json" id="embedded-video-database">
        ${JSON.stringify(dbPayload, null, 8)}
        <\/script>
    </div>

    <script src="config.js"><\/script>
    <script src="storage.js"><\/script>
    <script src="github-sync.js"><\/script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();
            try {
                const embeddedScript = document.getElementById('embedded-video-database');
                if (embeddedScript) {
                    const dbData = JSON.parse(embeddedScript.textContent);
                    if (dbData) {
                        if (dbData.models) StorageDB.saveModels(dbData.models);
                        if (dbData.streams) StorageDB.saveVideoStreams(dbData.streams);
                    }
                }
            } catch (e) {}
        });

        async function downloadUpdatedVideoGallery() {
            location.reload();
        }
    <\/script>
</body>
</html>`;

            // Trigger GitHub auto-sync during export/download
            await GitHubSync.triggerAutoSync();

            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'video-gallery.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>


</body></html>
