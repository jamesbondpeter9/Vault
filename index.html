<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Authentication Guard -->
    <script>
        if (sessionStorage.getItem('portal_authenticated') !== 'true') {
            alert('Access Denied: Please log in first.');
            window.location.href = 'login.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Portal - Home</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .nav-bar-compact {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 2px;
            margin-bottom: 20px;
            max-width: 1700px;
            margin-left: auto;
            margin-right: auto;
        }
        @media(max-width: 900px) { .nav-bar-compact { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media(max-width: 500px) { .nav-bar-compact { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

        .mondrian-nav-box {
            height: 52px !important;
            font-size: 0.85rem !important;
            border-radius: 12px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: #fff;
            border: 1px solid var(--card-border);
            text-decoration: none;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .mondrian-nav-box:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .home-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-auto-rows: 140px;
            grid-auto-flow: dense;
            gap: 4px;
            align-items: stretch;
        }
        @media(max-width: 900px) { 
            .home-grid { 
                grid-template-columns: repeat(2, minmax(0, 1fr)); 
                grid-auto-rows: 150px;
            } 
        }
        @media(max-width: 500px) { 
            .home-grid { 
                grid-template-columns: 1fr; 
                grid-auto-rows: 190px;
            } 
        }

        .mondrian-card {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 12px;
            text-decoration: none;
            background: #000;
            display: block;
            box-sizing: border-box;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .mondrian-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .mondrian-card.portrait {
            grid-column: span 1; 
            grid-row: span 2;
            aspect-ratio: 9 / 16;
        }

        .mondrian-card.landscape {
            grid-column: span 2; 
            grid-row: span 4;
        }

        @media(max-width: 900px) {
            .mondrian-card.portrait,
            .mondrian-card.landscape {
                grid-column: span 1;
            }
        }

        .mondrian-card.square {
            grid-column: span 1;
            grid-row: span 1;
            aspect-ratio: 1 / 1;
        }

        .mondrian-thumb {
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
        }

        .mondrian-thumb img {
            width: 100%;
            height: 100%;
            object-fit: fill;
            object-position: center;
            display: block;
            border-radius: 12px;
        }

        .mondrian-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 22px 10px 8px 10px;
            background: transparent;
            font-weight: 700;
            font-size: 0.8rem;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            z-index: 5;
            box-sizing: border-box;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>
    <div class="site-container">
        <!-- Compact Top Nav Bar -->
        <div class="nav-bar-compact">
            <a href="index.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="background: transparent; color: #fff;">Home</div></a>
            <a href="Model/models.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Models</div></a>
            <a href="Image/photostream.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="font-size: 1.2rem; font-weight: 800;" title="Photostream">★</div></a>
            <a href="Media/stream.html" class="mondrian-nav-card"><div class="mondrian-nav-box" style="font-size: 1.3rem; font-weight: 900;">+</div></a>
        </div>
        
        <div class="home-grid" id="streamsGrid"></div>
    </div>
    
    <script src="config.js"></script>
    <script src="storage.js"></script>
    <script src="github-sync.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();
            const allStreams = StorageDB.getVideoStreams();
            const grid = document.getElementById('streamsGrid');
            
            if (allStreams.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 4; text-align: center; color: var(--text-muted); padding: 60px;">No streams found. Click "+" to create your first stream!</div>`;
                return;
            }
            
            grid.innerHTML = '';
            
            allStreams.forEach((stream) => {
                const card = document.createElement('a');
                const globalIndex = allStreams.findIndex(s => s.url === stream.url && s.title === stream.title);
                card.href = `watch.html?index=${globalIndex}`;
                card.className = `mondrian-card portrait`;

                card.innerHTML = `
                    <div class="mondrian-thumb">
                        ${stream.thumbnail ? `<img src="${stream.thumbnail}" alt="${stream.title}" class="lazy-thumb">` : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;font-size:0.8rem;">No Thumbnail</div>'}
                        <div class="mondrian-overlay">${stream.title}</div>
                    </div>`;
            
                grid.appendChild(card);

                if (stream.thumbnail) {
                    const img = card.querySelector('.lazy-thumb');
                    img.onload = () => {
                        const ratio = img.naturalWidth / img.naturalHeight;
                        if (ratio < 0.85) {
                            card.className = 'mondrian-card portrait';
                        } else if (ratio > 1.25) {
                            card.className = 'mondrian-card landscape';
                        } else {
                            card.className = 'mondrian-card square';
                        }
                    };
                }
            });
        });
    </script>
</body>
</html>
