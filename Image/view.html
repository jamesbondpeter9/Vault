<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Authentication Guard -->
    <script>
        if (sessionStorage.getItem('portal_authenticated') !== 'true') {
            alert('Access Denied: Please log in first.');
            window.location.href = '../login.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Folder View - Portal</title>
    <!-- Imported Montserrat Font matching index.html -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <style>
        html, body {
            -webkit-text-size-adjust: 100%;
            -webkit-overflow-scrolling: touch;
        }
        @media (max-width: 900px) {
            html, body {
                touch-action: manipulation;
            }
        }

        .nav-bar-compact {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2px;
            margin-bottom: 20px;
            max-width: 1700px;
            margin-left: auto;
            margin-right: auto;
        }
        @media(max-width: 900px) { .nav-bar-compact { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media(max-width: 500px) { .nav-bar-compact { display: none !important; } }

        .mondrian-nav-box {
            height: 52px !important;
            font-size: 0.85rem !important;
            border-radius: 12px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: #fff;
            border: 1px solid var(--card-border);
            text-decoration: none;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .mondrian-nav-box:hover { background: #fff; color: #000; border-color: #fff; }

        .tag-header {
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px 32px;
            margin-bottom: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), var(--neon-glow);
        }

        .vault-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-auto-rows: 180px;
            grid-auto-flow: dense;
            gap: 2px;
            align-items: stretch;
        }
        @media(max-width: 1400px) { .vault-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media(max-width: 900px) { .vault-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media(max-width: 500px) { .vault-grid { grid-template-columns: 1fr; } }

        .mondrian-card.landscape { grid-column: span 2; grid-row: span 3; }
        .mondrian-card.portrait { grid-column: span 1; grid-row: span 3; }

        .mondrian-thumb {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .mondrian-card.portrait .mondrian-thumb img,
        .mondrian-card.landscape .mondrian-thumb img {
            object-fit: cover !important;
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
        }

        /* Mobile specific enhancements matching index.html structure, shapes, fonts, colours, and backgrounds */
        @media(max-width: 500px) {
            html, body {
                background: radial-gradient(circle at 50% 0%, #241d08 0%, #050505 75%, #000000 100%) !important;
                color: #ffffff !important;
                font-family: 'Montserrat', sans-serif !important;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                text-rendering: optimizeLegibility;
                -webkit-tap-highlight-color: transparent !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow-x: hidden !important;
            }

            .site-container {
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .tag-header {
                background: rgba(15, 12, 4, 0.95) !important;
                backdrop-filter: blur(12px) !important;
                -webkit-backdrop-filter: blur(12px) !important;
                border: none !important;
                border-bottom: 0.5px solid rgba(212, 175, 55, 0.4) !important;
                border-radius: 0 !important;
                padding: 12px 14px !important;
                margin: 0 5px 4px 5px !important;
                box-shadow: none !important;
                width: calc(100vw - 10px) !important;
                box-sizing: border-box !important;
            }
            .tag-header h1 {
                font-size: 1.15rem !important;
                margin-bottom: 2px !important;
                font-weight: 800 !important;
                color: #fff !important;
            }
            .tag-header p {
                font-size: 0.75rem !important;
                color: var(--text-muted) !important;
            }

            .vault-grid {
                display: flex !important;
                flex-direction: column !important;
                gap: 5px !important;
                padding: 0 5px !important;
                margin: 0 !important;
                width: 100vw !important;
                max-width: 100vw !important;
                box-sizing: border-box !important;
            }

            .mondrian-card {
                grid-column: 1 / -1 !important;
                grid-row: auto !important;
                aspect-ratio: 16 / 11 !important;
                height: auto !important;
                border-radius: 6px !important;
                border: 0.5px solid rgba(212, 175, 55, 0.4) !important;
                box-shadow: 0 0 25px rgba(212, 175, 55, 0.18) !important;
                background: rgb(0, 0, 0) !important;
                outline: none !important;
                margin: 0 !important;
                width: calc(100vw - 10px) !important;
                position: relative !important;
                left: 0 !important;
                right: 0 !important;
                transform: none !important;
                transition: none !important;
                -webkit-tap-highlight-color: transparent !important;
                box-sizing: border-box !important;
            }

            .mondrian-card:first-child {
                margin-top: 0 !important;
                padding-top: 0 !important;
            }

            .mondrian-card:hover,
            .mondrian-card:active,
            .mondrian-card:focus {
                transform: none !important;
                box-shadow: none !important;
                z-index: 1 !important;
                outline: none !important;
            }

            .mondrian-thumb {
                border-radius: 6px !important;
                background: rgb(0, 0, 0) !important;
                position: absolute !important;
                inset: 0 !important;
                width: 100% !important;
                height: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: hidden !important;
            }

            .mondrian-thumb img {
                border-radius: 0 !important;
                object-fit: cover !important;
                object-position: center !important;
                width: 100% !important;
                height: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                filter: contrast(1.0) saturate(1.25) !important;
                image-rendering: -webkit-optimize-contrast;
                image-rendering: high-dpi;
            }
            
            .mondrian-overlay {
                display: none !important;
            }

            .mondrian-thumb button[title="Delete Photo"] {
                display: none !important;
            }
        }

        /* Desktop Inbuilt Custom Photo Viewer Styles */
        #inbuiltPhotoModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            box-sizing: border-box;
            outline: none;
        }
        #inbuiltPhotoModal.active {
            display: flex;
        }
        .viewer-content-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .viewer-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            cursor: grab;
            transform-origin: center center;
            will-change: transform;
        }
        .viewer-image:active {
            cursor: grabbing;
        }
        .viewer-nav-left, .viewer-nav-right {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 10;
            cursor: pointer;
            background: transparent;
            border: none;
            outline: none;
        }
        .viewer-nav-left { left: 0; }
        .viewer-nav-right { right: 0; }
        .viewer-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            font-size: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            outline: none;
        }
        .viewer-title-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 20px;
            color: #fff;
            font-size: 0.9rem;
            z-index: 20;
            pointer-events: none;
            max-width: 80%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Separate Dedicated Mobile Photo Viewer Modal */
        #mobilePhotoModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.98);
            z-index: 999999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            outline: none;
        }
        #mobilePhotoModal.active {
            display: flex;
        }
        .mob-viewer-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
        }
        .mob-viewer-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transform-origin: center center;
            will-change: transform;
            -webkit-tap-highlight-color: transparent;
        }
        .mob-viewer-close {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            font-size: 18px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 30;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .mob-viewer-title {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 12px;
            color: #fff;
            font-size: 0.7rem;
            z-index: 30;
            pointer-events: none;
            max-width: 80%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .mob-nav-left, .mob-nav-right {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 20;
            cursor: pointer;
            background: transparent;
            border: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .mob-nav-left { left: 0; }
        .mob-nav-right { right: 0; }

        .mob-viewer-image.mobile-landscape-natural {
            width: 100vw !important;
            max-width: 100vw !important;
            height: auto !important;
            max-height: 100vh !important;
            object-fit: contain !important;
            transform: none !important;
        }
        .mob-viewer-image.mobile-portrait-natural {
            height: 100vh !important;
            height: 100dvh !important;
            max-height: 100vh !important;
            max-height: 100dvh !important;
            width: auto !important;
            max-width: 100vw !important;
            object-fit: contain !important;
            transform: none !important;
        }
        .mob-viewer-image.mobile-auto-rotate {
            transform: rotate(90deg) !important;
            width: 100vh !important;
            width: 100dvh !important;
            height: 100vw !important;
            max-width: 100vh !important;
            max-width: 100dvh !important;
            max-height: 100vw !important;
            object-fit: contain !important;
        }
    </style>
</head>
<body>
    <div class="site-container">
        <div class="nav-bar-compact">
            <a href="../index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a id="backToAlbums" href="albums.html" class="mondrian-nav-card"><div class="mondrian-nav-box">← Back to Albums</div></a>
        </div>

        <div class="tag-header">
            <h1 id="tagTitle" style="font-size: 1.6rem; font-weight: 800; color: #fff; margin-bottom: 4px;">Folder View</h1>
            <div style="display: flex; align-items: center; gap: 10px;">
                <p id="tagSubtitle" style="color: var(--text-muted); font-size: 0.85rem; margin: 0;">Photos inside this album folder</p>
                <span id="folderCountBadge" style="display: inline-flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); border: 1px solid var(--card-border); color: #fff; font-size: 0.75rem; font-weight: 700; width: 22px; height: 22px; border-radius: 50%;">0</span>
            </div>
        </div>

        <div class="vault-grid" id="vaultGrid"></div>
    </div>

    <!-- Desktop Photo Viewer Modal -->
    <div id="inbuiltPhotoModal">
        <button class="viewer-close-btn" onclick="closeInbuiltModal()">&times;</button>
        <div class="viewer-nav-left" onclick="navigateViewer(-1)"></div>
        <div class="viewer-nav-right" onclick="navigateViewer(1)"></div>
        <div class="viewer-content-wrapper" id="viewerContentWrapper">
            <img id="viewerImageElement" class="viewer-image" src="" alt="Full View">
        </div>
        <div id="viewerTitleElement" class="viewer-title-bar"></div>
    </div>

    <!-- Separate Dedicated Mobile Photo Viewer Modal -->
    <div id="mobilePhotoModal">
        <button class="mob-viewer-close" onclick="closeMobileModal()">&times;</button>
        <div class="mob-nav-left" onclick="navigateMobileViewer(-1)"></div>
        <div class="mob-nav-right" onclick="navigateMobileViewer(1)"></div>
        <div class="mob-viewer-wrapper" id="mobViewerWrapper">
            <img id="mobViewerImage" class="mob-viewer-image" src="" alt="Mobile Full View">
        </div>
        <div id="mobViewerTitle" class="mob-viewer-title"></div>
    </div>

    <script src="../config.js"></script>
    <script src="images-storage.js"></script>
    <script src="../github-sync.js"></script>
    <script>
        let currentFolderName = '';
        let currentModelName = '';
        let currentViewerIndex = 0;
        let currentScale = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        let mobCurrentScale = 1;
        let mobPanX = 0;
        let mobPanY = 0;
        let mobIsDragging = false;
        let mobTouchStartX = 0;
        let mobTouchStartY = 0;
        let mobInitialPinchDistance = 0;
        let mobInitialScaleForPinch = 1;

        function extractImageUrl(input) {
            if (!input) return '';
            input = input.trim();
            const bbcodeMatch = input.match(/\[img\](.*?)\[\/img\]/i);
            if (bbcodeMatch && bbcodeMatch[1]) return bbcodeMatch[1].trim();
            const htmlImgMatch = input.match(/<img[^>]+src=["']([^"']+)["']/i);
            if (htmlImgMatch && htmlImgMatch[1]) return htmlImgMatch[1].trim();
            const urlMatch = input.match(/(https?:\/\/[^\s"'<>]+)/i);
            if (urlMatch && urlMatch[1]) return urlMatch[1].trim();
            return input;
        }

        function getImageOrientation(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img.naturalHeight > img.naturalWidth ? 'portrait' : 'landscape');
                img.onerror = () => resolve('landscape');
                img.src = url;
            });
        }

        async function fetchMobileUnifiedImages() {
            let images = [];
            try {
                const res = await fetch('../Image/images.json');
                if (res.ok) {
                    const json = await res.json();
                    images = json.photostreams || json.streams || [];
                }
            } catch (e) {
                try {
                    const resLocal = await fetch('Image/images.json');
                    if (resLocal.ok) {
                        const json = await resLocal.json();
                        images = json.photostreams || json.streams || [];
                    }
                } catch (err) {}
            }

            if (images.length === 0 && typeof ImageStorageDB !== 'undefined') {
                try {
                    if (typeof ImageStorageDB.initDB === 'function') await ImageStorageDB.initDB();
                    images = (typeof ImageStorageDB.getPhotoStreams === 'function') ? ImageStorageDB.getPhotoStreams() || [] : [];
                } catch (e) {}
            }

            if (images.length === 0) {
                try {
                    const localImages = localStorage.getItem('portal_images') || localStorage.getItem('images_db');
                    if (localImages) {
                        const parsed = JSON.parse(localImages);
                        images = parsed.photostreams || parsed.streams || [];
                    }
                } catch (e) {}
            }

            return images;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof ImageStorageDB !== 'undefined' && typeof ImageStorageDB.initDB === 'function') {
                await ImageStorageDB.initDB();
            }

            const params = new URLSearchParams(window.location.search);
            currentFolderName = decodeURIComponent(params.get('folder') ?? '');
            currentModelName = decodeURIComponent(params.get('model') ?? '');

            if (currentFolderName) {
                document.getElementById('tagTitle').textContent = currentFolderName;
                document.title = `${currentFolderName} - Portal`;
            }

            if (currentModelName) {
                document.getElementById('backToAlbums').href = `albums.html?name=${encodeURIComponent(currentModelName)}`;
            }

            const allPhotoStreams = await fetchMobileUnifiedImages();
            const folderImages = allPhotoStreams.filter(item => {
                const matchesFolder = item.folder === currentFolderName || (Array.isArray(item.folders) && item.folders.includes(currentFolderName));
                const matchesModel = !currentModelName || (item.models && item.models.some(m => m.toLowerCase() === currentModelName.toLowerCase()));
                return matchesFolder && matchesModel;
            });

            folderImages.sort((a, b) => {
                const titleA = (a.title || '').toLowerCase();
                const titleB = (b.title || '').toLowerCase();
                return titleA !== titleB ? titleA.localeCompare(titleB) : (a.createdAt || 0) - (b.createdAt || 0);
            });

            const badge = document.getElementById('folderCountBadge');
            if (badge) badge.textContent = folderImages.length;

            const grid = document.getElementById('vaultGrid');
            grid.innerHTML = '';

            if (folderImages.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 4; text-align: center; color: var(--text-muted); padding: 60px;">No photos found in this folder.</div>`;
                return;
            }

            for (let idx = 0; idx < folderImages.length; idx++) {
                const imgItem = folderImages[idx];
                const thumbUrl = extractImageUrl(imgItem.thumbnail || imgItem.url || '');
                const orientation = await getImageOrientation(thumbUrl);

                const card = document.createElement('div');
                card.className = `mondrian-card ${orientation}`;
                card.innerHTML = `
                    <div class="mondrian-thumb" onclick="openPhotoModal(${idx})" style="background: var(--card-bg); border: 1px solid var(--card-border); width: 100%; height: 100%; position: relative;">
                        <button onclick="deletePhoto(${idx}, event)" title="Delete Photo" style="position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.3); color: #ff4d4d; border-radius: 50%; width: 24px; height: 24px; font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 20; padding: 0; line-height: 1;">&times;</button>
                        ${thumbUrl ? `<img src="${thumbUrl}" alt="${imgItem.title || 'Photo'}" style="width: 100%; height: 100%; position: absolute; inset: 0;">` : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;">No Image</div>'}
                    </div>`;
                grid.appendChild(card);
            }

            window.folderImagesList = folderImages;

            // Desktop Viewer Event Listeners
            const viewerImg = document.getElementById('viewerImageElement');
            const wrapper = document.getElementById('viewerContentWrapper');

            if (wrapper && viewerImg) {
                wrapper.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const zoomFactor = 1.15;
                    const oldScale = currentScale;
                    
                    if (e.deltaY < 0) {
                        currentScale = Math.min(currentScale * zoomFactor, 10);
                    } else {
                        currentScale = Math.max(currentScale / zoomFactor, 1);
                    }

                    if (currentScale === 1) {
                        panX = 0;
                        panY = 0;
                    } else {
                        const rect = wrapper.getBoundingClientRect();
                        const mouseX = e.clientX - rect.left - rect.width / 2;
                        const mouseY = e.clientY - rect.top - rect.height / 2;
                        panX = mouseX - (mouseX - panX) * (currentScale / oldScale);
                        panY = mouseY - (mouseY - panY) * (currentScale / oldScale);
                    }
                    updateImageTransform();
                }, { passive: false });

                viewerImg.addEventListener('mousedown', (e) => {
                    if (currentScale > 1) {
                        isDragging = true;
                        startX = e.clientX - panX;
                        startY = e.clientY - panY;
                        e.stopPropagation();
                    }
                });

                window.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    panX = e.clientX - startX;
                    panY = e.clientY - startY;
                    updateImageTransform();
                });

                window.addEventListener('mouseup', () => {
                    isDragging = false;
                });
            }

            // Separate Dedicated Mobile Viewer Event Listeners
            const mobImg = document.getElementById('mobViewerImage');
            const mobWrapper = document.getElementById('mobViewerWrapper');

            if (mobWrapper && mobImg) {
                function getTouchDistance(touches) {
                    const dx = touches[0].clientX - touches[1].clientX;
                    const dy = touches[0].clientY - touches[1].clientY;
                    return Math.sqrt(dx * dx + dy * dy);
                }

                mobImg.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 2) {
                        mobIsDragging = false;
                        mobInitialPinchDistance = getTouchDistance(e.touches);
                        mobInitialScaleForPinch = mobCurrentScale;
                    } else if (e.touches.length === 1) {
                        if (mobCurrentScale > 1) {
                            mobIsDragging = true;
                            mobTouchStartX = e.touches[0].clientX - mobPanX;
                            mobTouchStartY = e.touches[0].clientY - mobPanY;
                        } else {
                            mobIsDragging = false;
                        }
                    }
                }, { passive: true });

                mobImg.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 2 && mobInitialPinchDistance > 0) {
                        e.preventDefault();
                        const currentDistance = getTouchDistance(e.touches);
                        const pinchFactor = currentDistance / mobInitialPinchDistance;
                        mobCurrentScale = Math.min(Math.max(mobInitialScaleForPinch * pinchFactor, 1), 10);
                        if (mobCurrentScale === 1) {
                            mobPanX = 0;
                            mobPanY = 0;
                        }
                        updateMobileImageTransform();
                    } else if (mobIsDragging && e.touches.length === 1 && mobCurrentScale > 1) {
                        e.preventDefault();
                        mobPanX = e.touches[0].clientX - mobTouchStartX;
                        mobPanY = e.touches[0].clientY - mobTouchStartY;
                        updateMobileImageTransform();
                    }
                }, { passive: false });

                mobImg.addEventListener('touchend', (e) => {
                    if (e.touches.length < 2) {
                        mobInitialPinchDistance = 0;
                    }
                    if (e.touches.length === 0) {
                        mobIsDragging = false;
                    }
                });
            }

            window.addEventListener('keydown', (e) => {
                const modal = document.getElementById('inbuiltPhotoModal');
                const mobModal = document.getElementById('mobilePhotoModal');

                if (modal && modal.classList.contains('active')) {
                    if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        navigateViewer(1);
                    } else if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        navigateViewer(-1);
                    } else if (e.key === 'Escape') {
                        e.preventDefault();
                        closeInbuiltModal();
                    }
                } else if (mobModal && mobModal.classList.contains('active')) {
                    if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        navigateMobileViewer(1);
                    } else if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        navigateMobileViewer(-1);
                    } else if (e.key === 'Escape') {
                        e.preventDefault();
                        closeMobileModal();
                    }
                }
            });
        });

        function updateImageTransform() {
            const viewerImg = document.getElementById('viewerImageElement');
            if (!viewerImg) return;
            viewerImg.style.transform = `translate(${panX}px, ${panY}px) scale(${currentScale})`;
        }

        function updateMobileImageTransform() {
            const mobImg = document.getElementById('mobViewerImage');
            if (!mobImg) return;
            const isAutoRotated = mobImg.classList.contains('mobile-auto-rotate');
            
            if (isAutoRotated) {
                mobImg.style.transform = `translate(${mobPanX}px, ${mobPanY}px) rotate(90deg) scale(${mobCurrentScale})`;
            } else {
                mobImg.style.transform = `translate(${mobPanX}px, ${mobPanY}px) scale(${mobCurrentScale})`;
            }
        }

        function openPhotoModal(index) {
            const isMobileDevice = window.innerWidth <= 500 || /Mobi|Android/i.test(navigator.userAgent);
            if (isMobileDevice) {
                openMobileModal(index);
            } else {
                openDesktopModal(index);
            }
        }

        function openDesktopModal(index) {
            if (window.folderImagesList && window.folderImagesList[index]) {
                currentViewerIndex = index;
                currentScale = 1;
                panX = 0;
                panY = 0;
                const photo = window.folderImagesList[index];
                const fullResUrl = extractImageUrl(photo.url || photo.thumbnail || photo.image);

                const modal = document.getElementById('inbuiltPhotoModal');
                const viewerImg = document.getElementById('viewerImageElement');
                const viewerTitle = document.getElementById('viewerTitleElement');

                if (modal && viewerImg) {
                    viewerImg.className = 'viewer-image';
                    viewerImg.src = fullResUrl;
                    if (viewerTitle) viewerTitle.textContent = photo.title || 'Photo View';
                    modal.classList.add('active');
                    updateImageTransform();
                }
            }
        }

        function closeInbuiltModal() {
            const modal = document.getElementById('inbuiltPhotoModal');
            if (modal) {
                modal.classList.remove('active');
            }
            const viewerImg = document.getElementById('viewerImageElement');
            if (viewerImg) {
                viewerImg.src = '';
            }
        }

        function navigateViewer(direction) {
            if (!window.folderImagesList || window.folderImagesList.length === 0) return;
            currentViewerIndex += direction;
            if (currentViewerIndex < 0) {
                currentViewerIndex = window.folderImagesList.length - 1;
            } else if (currentViewerIndex >= window.folderImagesList.length) {
                currentViewerIndex = 0;
            }
            openDesktopModal(currentViewerIndex);
        }

        // Separate Dedicated Mobile Photo Viewer Logic
        function openMobileModal(index) {
            if (window.folderImagesList && window.folderImagesList[index]) {
                currentViewerIndex = index;
                mobCurrentScale = 1;
                mobPanX = 0;
                mobPanY = 0;
                const photo = window.folderImagesList[index];
                const fullResUrl = extractImageUrl(photo.url || photo.thumbnail || photo.image);

                const mobModal = document.getElementById('mobilePhotoModal');
                const mobImg = document.getElementById('mobViewerImage');
                const mobTitle = document.getElementById('mobViewerTitle');

                if (mobModal && mobImg) {
                    mobImg.className = 'mob-viewer-image';
                    mobImg.src = fullResUrl;
                    if (mobTitle) mobTitle.textContent = photo.title || 'Photo View';
                    mobModal.classList.add('active');

                    const tempImg = new Image();
                    tempImg.onload = () => {
                        const naturalW = tempImg.naturalWidth;
                        const naturalH = tempImg.naturalHeight;
                        const isLandscape = naturalW > naturalH;
                        const screenW = window.innerWidth;
                        const screenH = window.innerHeight;
                        const isScreenPortrait = screenH > screenW;

                        mobImg.classList.remove('mobile-landscape-natural', 'mobile-portrait-natural', 'mobile-auto-rotate');

                        if (isLandscape && isScreenPortrait) {
                            mobImg.classList.add('mobile-auto-rotate');
                        } else if (isLandscape) {
                            mobImg.classList.add('mobile-landscape-natural');
                        } else {
                            mobImg.classList.add('mobile-portrait-natural');
                        }
                        updateMobileImageTransform();
                    };
                    tempImg.src = fullResUrl;
                }
            }
        }

        function closeMobileModal() {
            const mobModal = document.getElementById('mobilePhotoModal');
            if (mobModal) {
                mobModal.classList.remove('active');
            }
            const mobImg = document.getElementById('mobViewerImage');
            if (mobImg) {
                mobImg.src = '';
                mobImg.className = 'mob-viewer-image';
            }
        }

        function navigateMobileViewer(direction) {
            if (!window.folderImagesList || window.folderImagesList.length === 0) return;
            currentViewerIndex += direction;
            if (currentViewerIndex < 0) {
                currentViewerIndex = window.folderImagesList.length - 1;
            } else if (currentViewerIndex >= window.folderImagesList.length) {
                currentViewerIndex = 0;
            }
            openMobileModal(currentViewerIndex);
        }

        async function deletePhoto(index, event) {
            if (event) event.stopPropagation();
            if (!confirm('Are you sure you want to delete this photo?')) return;

            const photo = window.folderImagesList[index];
            if (!photo) return;

            if (typeof ImageStorageDB !== 'undefined' && typeof ImageStorageDB.deletePhotoStream === 'function') {
                await ImageStorageDB.deletePhotoStream(photo.id || photo.title);
            }

            window.location.reload();
        }
    </script>
</body>
</html>
