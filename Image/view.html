<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Authentication Guard -->
    <script>
        if (sessionStorage.getItem('portal_authenticated') !== 'true') {
            alert('Access Denied: Please log in first.');
            window.location.href = '../login.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Folder View - Portal</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        html, body {
            -webkit-text-size-adjust: 100%;
            -webkit-overflow-scrolling: touch;
        }
        @media (max-width: 900px) {
            html, body {
                touch-action: manipulation;
            }
        }

        .nav-bar-compact {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2px;
            margin-bottom: 20px;
            max-width: 1700px;
            margin-left: auto;
            margin-right: auto;
        }
        @media(max-width: 900px) { .nav-bar-compact { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media(max-width: 500px) { .nav-bar-compact { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

        .mondrian-nav-box {
            height: 52px !important;
            font-size: 0.85rem !important;
            border-radius: 12px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: #fff;
            border: 1px solid var(--card-border);
            text-decoration: none;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .mondrian-nav-box:hover { background: #fff; color: #000; border-color: #fff; }

        .tag-header {
            background: var(--card-bg);
            backdrop-filter: blur(40px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px 32px;
            margin-bottom: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8), var(--neon-glow);
        }

        .vault-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            grid-auto-rows: 180px;
            grid-auto-flow: dense;
            gap: 2px;
            align-items: stretch;
        }
        @media(max-width: 1400px) { .vault-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media(max-width: 900px) { .vault-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media(max-width: 500px) { .vault-grid { grid-template-columns: 1fr; } }

        .mondrian-card.landscape { grid-column: span 2; grid-row: span 3; }
        .mondrian-card.portrait { grid-column: span 1; grid-row: span 3; }

        .mondrian-thumb {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .mondrian-card.portrait .mondrian-thumb img,
        .mondrian-card.landscape .mondrian-thumb img {
            object-fit: cover !important;
            width: 100%;
            height: 100%;
            position: absolute;
            inset: 0;
        }

        /* Inbuilt Custom Photo Viewer Styles */
        #inbuiltPhotoModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: rgba(0, 0, 0, 0.95);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        @media (max-width: 900px) {
            #inbuiltPhotoModal {
                touch-action: none;
            }
        }
        #inbuiltPhotoModal.active {
            display: flex;
        }
        .viewer-content-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        @media (max-width: 900px) {
            .viewer-content-wrapper {
                touch-action: none;
            }
        }
        .viewer-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            cursor: grab;
            transform-origin: center center;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            will-change: transform;
            -webkit-tap-highlight-color: transparent;
        }
        @media (max-width: 900px) {
            .viewer-image {
                touch-action: none;
            }
        }
        .viewer-image:active {
            cursor: grabbing;
        }
        .viewer-nav-left, .viewer-nav-right {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 50%;
            z-index: 10;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            border: none;
            background: transparent;
        }
        .viewer-nav-left { left: 0; }
        .viewer-nav-right { right: 0; }
        .viewer-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.3);
            color: #fff;
            font-size: 24px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }
        .viewer-title-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 8px 16px;
            border-radius: 20px;
            color: #fff;
            font-size: 0.9rem;
            z-index: 20;
            pointer-events: none;
            max-width: 80%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        @media(max-width: 900px) {
            .viewer-image.mobile-landscape-cover {
                width: 100vw !important;
                height: 100vh !important;
                height: 100dvh !important;
                max-width: none !important;
                max-height: none !important;
                object-fit: cover !important;
                transform: none !important;
            }
            .viewer-image.mobile-portrait-fit {
                max-width: 100% !important;
                max-height: 100% !important;
                width: auto !important;
                height: auto !important;
                object-fit: contain !important;
                transform: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="site-container">
        <div class="nav-bar-compact">
            <a href="../index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a id="backToAlbums" href="albums.html" class="mondrian-nav-card"><div class="mondrian-nav-box">← Back to Albums</div></a>
        </div>

        <div class="tag-header">
            <h1 id="tagTitle" style="font-size: 1.6rem; font-weight: 800; color: #fff; margin-bottom: 4px;">Folder View</h1>
            <div style="display: flex; align-items: center; gap: 10px;">
                <p id="tagSubtitle" style="color: var(--text-muted); font-size: 0.85rem; margin: 0;">Photos inside this album folder</p>
                <span id="folderCountBadge" style="display: inline-flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); border: 1px solid var(--card-border); color: #fff; font-size: 0.75rem; font-weight: 700; width: 22px; height: 22px; border-radius: 50%;">0</span>
            </div>
        </div>

        <div class="vault-grid" id="vaultGrid"></div>
    </div>

    <!-- Custom Photo Viewer Modal -->
    <div id="inbuiltPhotoModal">
        <button class="viewer-close-btn" onclick="closeInbuiltModal()">&times;</button>
        <div class="viewer-nav-left" onclick="navigateViewer(-1)"></div>
        <div class="viewer-nav-right" onclick="navigateViewer(1)"></div>
        <div class="viewer-content-wrapper" id="viewerContentWrapper">
            <img id="viewerImageElement" class="viewer-image" src="" alt="Full View">
        </div>
        <div id="viewerTitleElement" class="viewer-title-bar"></div>
    </div>

    <script src="../config.js"></script>
    <script src="images-storage.js"></script>
    <script src="../github-sync.js"></script>
    <script>
        let currentFolderName = '';
        let currentModelName = '';
        let currentViewerIndex = 0;
        let currentScale = 1;
        let panX = 0;
        let panY = 0;
        let isDragging = false;
        let startX = 0;
        let startY = 0;

        function extractImageUrl(input) {
            if (!input) return '';
            input = input.trim();
            const bbcodeMatch = input.match(/\[img\](.*?)\[\/img\]/i);
            if (bbcodeMatch && bbcodeMatch[1]) return bbcodeMatch[1].trim();
            const htmlImgMatch = input.match(/<img[^>]+src=["']([^"']+)["']/i);
            if (htmlImgMatch && htmlImgMatch[1]) return htmlImgMatch[1].trim();
            const urlMatch = input.match(/(https?:\/\/[^\s"'<>]+)/i);
            if (urlMatch && urlMatch[1]) return urlMatch[1].trim();
            return input;
        }

        function getImageOrientation(url) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img.naturalHeight > img.naturalWidth ? 'portrait' : 'landscape');
                img.onerror = () => resolve('landscape');
                img.src = url;
            });
        }

        // Mobile data loader fetching directly from Image/images.json as primary source
        async function fetchMobileUnifiedImages() {
            let images = [];
            const isMobileDevice = window.innerWidth <= 900 || /Mobi|Android/i.test(navigator.userAgent);

            // 1. Fetch directly from Image/images.json first to fulfill data resource requirement
            try {
                const res = await fetch('../Image/images.json');
                if (res.ok) {
                    const json = await res.json();
                    images = json.photostreams || json.streams || [];
                }
            } catch (e) {
                try {
                    const resLocal = await fetch('Image/images.json');
                    if (resLocal.ok) {
                        const json = await resLocal.json();
                        images = json.photostreams || json.streams || [];
                    }
                } catch (err) {}
            }

            // 2. Fallback to ImageStorageDB if Image/images.json returned empty
            if (images.length === 0 && typeof ImageStorageDB !== 'undefined') {
                try {
                    if (typeof ImageStorageDB.initDB === 'function') await ImageStorageDB.initDB();
                    images = (typeof ImageStorageDB.getPhotoStreams === 'function') ? ImageStorageDB.getPhotoStreams() || [] : [];
                } catch (e) {}
            }

            // 3. Fallback to localStorage keys if still empty
            if (images.length === 0) {
                try {
                    const localImages = localStorage.getItem('portal_images') || localStorage.getItem('images_db');
                    if (localImages) {
                        const parsed = JSON.parse(localImages);
                        images = parsed.photostreams || parsed.streams || [];
                    }
                } catch (e) {}
            }

            return images;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof ImageStorageDB !== 'undefined' && typeof ImageStorageDB.initDB === 'function') {
                await ImageStorageDB.initDB();
            }

            const params = new URLSearchParams(window.location.search);
            currentFolderName = decodeURIComponent(params.get('folder') ?? '');
            currentModelName = decodeURIComponent(params.get('model') ?? '');

            if (currentFolderName) {
                document.getElementById('tagTitle').textContent = currentFolderName;
                document.title = `${currentFolderName} - Portal`;
            }

            if (currentModelName) {
                document.getElementById('backToAlbums').href = `albums.html?name=${encodeURIComponent(currentModelName)}`;
            }

            const allPhotoStreams = await fetchMobileUnifiedImages();
            const folderImages = allPhotoStreams.filter(item => {
                const matchesFolder = item.folder === currentFolderName || (Array.isArray(item.folders) && item.folders.includes(currentFolderName));
                const matchesModel = !currentModelName || (item.models && item.models.some(m => m.toLowerCase() === currentModelName.toLowerCase()));
                return matchesFolder && matchesModel;
            });

            folderImages.sort((a, b) => {
                const titleA = (a.title || '').toLowerCase();
                const titleB = (b.title || '').toLowerCase();
                return titleA !== titleB ? titleA.localeCompare(titleB) : (a.createdAt || 0) - (b.createdAt || 0);
            });

            // Update folder count badge
            const badge = document.getElementById('folderCountBadge');
            if (badge) badge.textContent = folderImages.length;

            const grid = document.getElementById('vaultGrid');
            grid.innerHTML = '';

            if (folderImages.length === 0) {
                grid.innerHTML = `<div style="grid-column: span 4; text-align: center; color: var(--text-muted); padding: 60px;">No photos found in this folder.</div>`;
                return;
            }

            for (let idx = 0; idx < folderImages.length; idx++) {
                const imgItem = folderImages[idx];
                const thumbUrl = extractImageUrl(imgItem.thumbnail || imgItem.url || '');
                const orientation = await getImageOrientation(thumbUrl);

                const card = document.createElement('div');
                card.className = `mondrian-card ${orientation}`;
                card.innerHTML = `
                    <div class="mondrian-thumb" onclick="openPhotoModal(${idx})" style="background: var(--card-bg); border: 1px solid var(--card-border); width: 100%; height: 100%; position: relative;">
                        <button onclick="deletePhoto(${idx}, event)" title="Delete Photo" style="position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); border: 1px solid rgba(255,255,255,0.3); color: #ff4d4d; border-radius: 50%; width: 24px; height: 24px; font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 20; padding: 0; line-height: 1;">&times;</button>
                        ${thumbUrl ? `<img src="${thumbUrl}" alt="${imgItem.title || 'Photo'}" style="width: 100%; height: 100%; position: absolute; inset: 0;">` : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#888;">No Image</div>'}
                    </div>`;
                grid.appendChild(card);
            }

            window.folderImagesList = folderImages;

            // Setup Custom Viewer Interactions (Wheel Zoom, Mouse Drag, Touch Pan/Pinch Zoom, Keyboard Navigation)
            const viewerImg = document.getElementById('viewerImageElement');
            const wrapper = document.getElementById('viewerContentWrapper');

            if (wrapper && viewerImg) {
                wrapper.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const zoomFactor = 1.15;
                    const oldScale = currentScale;
                    
                    if (e.deltaY < 0) {
                        currentScale = Math.min(currentScale * zoomFactor, 10);
                    } else {
                        currentScale = Math.max(currentScale / zoomFactor, 1);
                    }

                    if (currentScale === 1) {
                        panX = 0;
                        panY = 0;
                    } else {
                        const rect = wrapper.getBoundingClientRect();
                        const mouseX = e.clientX - rect.left - rect.width / 2;
                        const mouseY = e.clientY - rect.top - rect.height / 2;
                        panX = mouseX - (mouseX - panX) * (currentScale / oldScale);
                        panY = mouseY - (mouseY - panY) * (currentScale / oldScale);
                    }
                    updateImageTransform();
                }, { passive: false });

                viewerImg.addEventListener('mousedown', (e) => {
                    if (currentScale > 1) {
                        isDragging = true;
                        startX = e.clientX - panX;
                        startY = e.clientY - panY;
                        e.stopPropagation();
                    }
                });

                window.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    panX = e.clientX - startX;
                    panY = e.clientY - startY;
                    updateImageTransform();
                });

                window.addEventListener('mouseup', () => {
                    isDragging = false;
                });

                let touchStartX = 0;
                let touchStartY = 0;
                let initialPinchDistance = 0;
                let initialScaleForPinch = 1;

                function getTouchDistance(touches) {
                    const dx = touches[0].clientX - touches[1].clientX;
                    const dy = touches[0].clientY - touches[1].clientY;
                    return Math.sqrt(dx * dx + dy * dy);
                }

                viewerImg.addEventListener('touchstart', (e) => {
                    const isMobileDevice = window.innerWidth <= 900 || /Mobi|Android/i.test(navigator.userAgent);
                    if (!isMobileDevice) return;

                    if (e.touches.length === 2) {
                        isDragging = false;
                        initialPinchDistance = getTouchDistance(e.touches);
                        initialScaleForPinch = currentScale;
                    } else if (e.touches.length === 1) {
                        if (currentScale > 1) {
                            isDragging = true;
                            touchStartX = e.touches[0].clientX - panX;
                            touchStartY = e.touches[0].clientY - panY;
                        } else {
                            isDragging = false;
                        }
                    }
                }, { passive: true });

                viewerImg.addEventListener('touchmove', (e) => {
                    const isMobileDevice = window.innerWidth <= 900 || /Mobi|Android/i.test(navigator.userAgent);
                    if (!isMobileDevice) return;

                    if (e.touches.length === 2 && initialPinchDistance > 0) {
                        e.preventDefault();
                        const currentDistance = getTouchDistance(e.touches);
                        const pinchFactor = currentDistance / initialPinchDistance;
                        currentScale = Math.min(Math.max(initialScaleForPinch * pinchFactor, 1), 10);
                        if (currentScale === 1) {
                            panX = 0;
                            panY = 0;
                        }
                        updateImageTransform();
                    } else if (isDragging && e.touches.length === 1) {
                        panX = e.touches[0].clientX - touchStartX;
                        panY = e.touches[0].clientY - touchStartY;
                        updateImageTransform();
                    }
                }, { passive: false });

                viewerImg.addEventListener('touchend', (e) => {
                    if (e.touches.length < 2) {
                        initialPinchDistance = 0;
                    }
                    if (e.touches.length === 0) {
                        isDragging = false;
                    }
                });

                window.addEventListener('keydown', (e) => {
                    const modal = document.getElementById('inbuiltPhotoModal');
                    if (!modal || !modal.classList.contains('active')) return;

                    if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        navigateViewer(1);
                    } else if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        navigateViewer(-1);
                    } else if (e.key === 'Escape') {
                        e.preventDefault();
                        closeInbuiltModal();
                    }
                });
            }
        });

        function updateImageTransform() {
            const viewerImg = document.getElementById('viewerImageElement');
            if (!viewerImg) return;
            viewerImg.style.transform = `translate(${panX}px, ${panY}px) scale(${currentScale})`;
        }

        function openPhotoModal(index) {
            if (window.folderImagesList && window.folderImagesList[index]) {
                currentViewerIndex = index;
                currentScale = 1;
                panX = 0;
                panY = 0;
                const photo = window.folderImagesList[index];
                const fullResUrl = extractImageUrl(photo.url || photo.thumbnail);

                const modal = document.getElementById('inbuiltPhotoModal');
                const viewerImg = document.getElementById('viewerImageElement');
                const viewerTitle = document.getElementById('viewerTitleElement');

                if (modal && viewerImg) {
                    viewerImg.classList.remove('mobile-landscape-cover', 'mobile-portrait-fit');
                    viewerImg.style.transform = 'scale(1) translate(0px, 0px)';
                    viewerImg.src = fullResUrl;
                    if (viewerTitle) viewerTitle.textContent = photo.title || 'Photo';
                    modal.classList.add('active');

                    const isMobileDevice = window.innerWidth <= 900 || /Mobi|Android/i.test(navigator.userAgent);
                    if (isMobileDevice) {
                        const tempImg = new Image();
                        tempImg.onload = () => {
                            if (tempImg.naturalWidth > tempImg.naturalHeight) {
                                viewerImg.classList.add('mobile-landscape-cover');
                            } else {
                                viewerImg.classList.add('mobile-portrait-fit');
                            }
                        };
                        tempImg.src = fullResUrl;
                    }
                }
            }
        }

        function closeInbuiltModal() {
            const modal = document.getElementById('inbuiltPhotoModal');
            if (modal) modal.classList.remove('active');
            const viewerImg = document.getElementById('viewerImageElement');
            if (viewerImg) viewerImg.src = '';
            currentScale = 1;
            panX = 0;
            panY = 0;
        }

        function navigateViewer(direction) {
            if (!window.folderImagesList || window.folderImagesList.length === 0) return;
            currentViewerIndex += direction;
            if (currentViewerIndex < 0) {
                currentViewerIndex = window.folderImagesList.length - 1;
            } else if (currentViewerIndex >= window.folderImagesList.length) {
                currentViewerIndex = 0;
            }
            openPhotoModal(currentViewerIndex);
        }

        async function deletePhoto(index, event) {
            event.stopPropagation();
            if (!confirm('Are you sure you want to delete this photo?')) return;

            const targetPhoto = window.folderImagesList[index];
            if (!targetPhoto) return;

            let allPhotoStreams = ImageStorageDB.getPhotoStreams() || [];
            allPhotoStreams = allPhotoStreams.filter(item => {
                const isMatchUrl = (item.url === targetPhoto.url || item.thumbnail === targetPhoto.thumbnail);
                const isMatchFolder = item.folder === currentFolderName || (Array.isArray(item.folders) && item.folders.includes(currentFolderName));
                return !(isMatchUrl && isMatchFolder);
            });

            ImageStorageDB.savePhotoStreams(allPhotoStreams);
            if (typeof GitHubSync !== 'undefined' && typeof GitHubSync.triggerAutoSync === 'function') {
                await GitHubSync.triggerAutoSync();
            }

            location.reload();
        }
    </script>
</body>
</html>
