<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Authentication Guard -->
    <script>
        if (sessionStorage.getItem('portal_authenticated') !== 'true') {
            alert('Access Denied: Please log in first.');
            window.location.href = '../login.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Photo - Portal</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        .nav-bar-compact {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2px;
            margin-bottom: 24px;
            max-width: 1650px;
            margin-left: auto;
            margin-right: auto;
        }
        @media(max-width: 900px) { .nav-bar-compact { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media(max-width: 500px) { .nav-bar-compact { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

        .mondrian-nav-box {
            height: 52px !important;
            font-size: 0.85rem !important;
            border-radius: 12px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: #fff;
            border: 1px solid var(--card-border);
            text-decoration: none;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .mondrian-nav-box:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .stream-layout-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2px;
            align-items: stretch;
            max-width: 1650px;
            margin-left: auto;
            margin-right: auto;
        }

        .control-panel {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .preview-wrapper {
            height: 100%;
            display: flex;
        }

        .live-thumb-preview-box {
            width: 100%;
            height: 100%;
            min-height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        .tag-section-wrapper {
            margin-bottom: 16px;
        }

        .tag-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .tag-section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .az-bar {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding: 4px 0;
            margin-bottom: 8px;
            scrollbar-width: none;
        }
        .az-bar::-webkit-scrollbar { display: none; }

        .az-letter {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
            user-select: none;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .az-letter:hover { background: rgba(255, 255, 255, 0.2); color: #fff; }
        .az-letter.active { background: #fff; color: #000; border-color: #fff; }
        .az-letter.disabled { opacity: 0.2; cursor: default; pointer-events: none; }

        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 120px;
            overflow-y: auto;
            padding: 8px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--text-muted) rgba(0,0,0,0.3);
        }

        .tags-container::-webkit-scrollbar { width: 6px; }
        .tags-container::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); border-radius: 6px; }
        .tags-container::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 6px; }

        .tag-pill {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-pill.selected { background: #fff; color: #000; border-color: #fff; }

        @media (max-width: 900px) {
            .stream-layout-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="site-container">
        <div class="nav-bar-compact">
            <a href="../index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="../Model/models.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Models</div></a>
        </div>

        <div class="stream-layout-container">
            <div class="control-panel">
                <div>
                    <h2 style="font-size: 1.25rem; font-weight: 800; margin-bottom: 20px;">Add New Photo</h2>
                    <form id="streamForm">
                        <div style="margin-bottom: 16px;">
                            <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Photo URL / Embed Code</label>
                            <input type="text" id="streamUrl" required placeholder="Paste direct link, HTML img, BBCode, or combined embed codes">
                        </div>

                        <div class="tag-section-wrapper">
                            <div class="tag-section-header">
                                <span class="tag-section-title">Tag Models</span>
                            </div>
                            <div class="az-bar" id="modelAZBar"></div>
                            <div class="tags-container" id="modelTagsList">
                                <span style="color: var(--text-muted); font-size: 0.80rem; padding: 4px;">No models in directory</span>
                            </div>
                        </div>

                        <div class="tag-section-wrapper">
                            <div class="tag-section-header">
                                <span class="tag-section-title">Tag Folders (Albums)</span>
                            </div>
                            <div class="az-bar" id="folderAZBar"></div>
                            <div class="tags-container" id="folderTagsList">
                                <span style="color: var(--text-muted); font-size: 0.80rem; padding: 4px;">Select a model first to view its folders</span>
                            </div>
                        </div>

                        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Save Photo</button>
                    </form>
                </div>
            </div>
            <div class="preview-wrapper">
                <div class="live-thumb-preview-box" id="previewContainer">
                    <span style="color: var(--text-muted);">Photo Preview</span>
                </div>
            </div>
        </div>
    </div>

    <script src="../config.js"></script>
    <script src="images-storage.js"></script>
    <script src="../github-sync.js"></script>
    <script>
        let selectedModels = [];
        let selectedFolders = [];
        let modelLetterFilter = 'ALL';
        let folderLetterFilter = 'ALL';
        let cachedModelsList = [];

        function extractAllImageUrls(input) {
            if (!input) return [];
            input = input.trim();
            const urls = [];

            const htmlImgRegex = /<img[^>]+src=["']([^"']+)["']/gi;
            let match;
            while ((match = htmlImgRegex.exec(input)) !== null) {
                if (match[1]) urls.push(match[1].trim());
            }

            const bbcodeRegex = /\[img\](.*?)\[\/img\]/gi;
            while ((match = bbcodeRegex.exec(input)) !== null) {
                if (match[1]) urls.push(match[1].trim());
            }

            const urlRegex = /https?:\/\/[^\s"'<>]+/gi;
            while ((match = urlRegex.exec(input)) !== null) {
                const u = match[0].trim();
                if (!urls.includes(u)) urls.push(u);
            }

            if (urls.length === 0 && input.length > 0) {
                input.split(/\s+/).forEach(l => {
                    if (l.startsWith('http://') || l.startsWith('https://')) urls.push(l.trim());
                });
            }
            return urls;
        }

        function generateTitleFromUrl(url) {
            try {
                const cleanUrl = url.split('?')[0].split('#')[0];
                const segments = cleanUrl.split('/');
                const filename = segments[segments.length - 1];
                if (filename) {
                    const nameWithoutExt = filename.substring(0, filename.lastIndexOf('.')) || filename;
                    const formatted = nameWithoutExt.replace(/[-_]/g, ' ').trim();
                    return formatted ? formatted.charAt(0).toUpperCase() + formatted.slice(1) : 'Untitled Photo';
                }
            } catch (e) {}
            return 'Untitled Photo';
        }

        function buildAZBar(barContainerId, itemsList, currentFilter, onSelectLetter) {
            const azBar = document.getElementById(barContainerId);
            if (!azBar) return;
            azBar.innerHTML = '';

            const availableLetters = new Set(
                itemsList.map(item => {
                    const name = typeof item === 'string' ? item : (item.name || item.title);
                    return name ? name.trim().charAt(0).toUpperCase() : '';
                })
            );

            const allBtn = document.createElement('span');
            allBtn.className = `az-letter ${currentFilter === 'ALL' ? 'active' : ''}`;
            allBtn.textContent = 'ALL';
            allBtn.onclick = () => onSelectLetter('ALL');
            azBar.appendChild(allBtn);

            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(letter => {
                const span = document.createElement('span');
                span.className = 'az-letter';
                span.textContent = letter;
                if (currentFilter === letter) span.classList.add('active');
                if (!availableLetters.has(letter)) {
                    span.classList.add('disabled');
                } else {
                    span.onclick = () => onSelectLetter(letter);
                }
                azBar.appendChild(span);
            });
        }

        // Robust multi-source model loader bridging root Model/Models.json and ImageStorageDB
        async function fetchAllModelsUnified() {
            let models = [];
            
            // 1. Try ImageStorageDB first
            if (typeof ImageStorageDB !== 'undefined') {
                try {
                    if (typeof ImageStorageDB.initDB === 'function') await ImageStorageDB.initDB();
                    if (typeof ImageStorageDB.getModels === 'function') {
                        models = ImageStorageDB.getModels() || [];
                    }
                } catch (e) {}
            }

            // 2. Fallback: Check localStorage / portal storage keys
            if (models.length === 0) {
                try {
                    const localData = localStorage.getItem('portal_models') || localStorage.getItem('models');
                    if (localData) {
                        const parsed = JSON.parse(localData);
                        models = Array.isArray(parsed) ? parsed : (parsed.models || []);
                    }
                } catch (e) {}
            }

            // 3. Fallback: Direct fetch from root Model/Models.json
            if (models.length === 0) {
                try {
                    const res = await fetch('../Model/Models.json');
                    if (res.ok) {
                        const data = await res.json();
                        models = data.models || [];
                    }
                } catch (e) {}
            }

            // Normalize models to object array format { name: "..." }
            return models.map(m => typeof m === 'string' ? { name: m } : m).filter(m => m && m.name);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof ImageStorageDB !== 'undefined' && typeof ImageStorageDB.initDB === 'function') {
                await ImageStorageDB.initDB();
            }

            await refreshModelsAndFolders();

            // Real-time synchronization listeners for storage changes across tabs / pages
            window.addEventListener('storage', async () => {
                await refreshModelsAndFolders();
            });

            // Periodic background check to catch model additions/deletions instantly
            setInterval(async () => {
                await refreshModelsAndFolders();
            }, 1000);

            const urlInput = document.getElementById('streamUrl');
            const previewContainer = document.getElementById('previewContainer');

            urlInput.addEventListener('input', () => {
                const urls = extractAllImageUrls(urlInput.value);
                if (urls.length > 0) {
                    previewContainer.innerHTML = `<img src="${urls[urls.length - 1]}" alt="Preview" style="width:100%;height:100%;max-height:100%;object-fit:contain;border-radius:20px;background:#000;">`;
                } else {
                    previewContainer.innerHTML = `<span style="color: var(--text-muted);">Photo Preview</span>`;
                }
            });

            document.getElementById('streamForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const urls = extractAllImageUrls(document.getElementById('streamUrl').value);
                if (urls.length === 0) return;
                
                urls.forEach(url => {
                    ImageStorageDB.addPhotoStream({
                        title: generateTitleFromUrl(url),
                        url,
                        thumbnail: url,
                        models: selectedModels,
                        folder: selectedFolders.length > 0 ? selectedFolders[0] : '',
                        folders: selectedFolders
                    });
                });

                document.getElementById('streamForm').reset();
                selectedModels = [];
                selectedFolders = [];
                modelLetterFilter = 'ALL';
                folderLetterFilter = 'ALL';
                await refreshModelsAndFolders();
                previewContainer.innerHTML = `<span style="color: var(--text-muted);">Photo Preview</span>`;
            });
        });

        async function refreshModelsAndFolders() {
            cachedModelsList = await fetchAllModelsUnified();
            renderModelTags();
            renderFolderTags();
        }

        function renderModelTags() {
            const models = cachedModelsList;
            const container = document.getElementById('modelTagsList');

            if (models.length === 0) {
                container.innerHTML = `<span style="color: var(--text-muted); font-size: 0.8rem; padding: 4px;">No models in directory</span>`;
                document.getElementById('modelAZBar').innerHTML = '';
                return;
            }

            models.sort((a, b) => a.name.localeCompare(b.name));
            buildAZBar('modelAZBar', models, modelLetterFilter, (l) => { modelLetterFilter = l; renderModelTags(); });

            const filtered = modelLetterFilter === 'ALL' ? models : models.filter(m => m.name.trim().charAt(0).toUpperCase() === modelLetterFilter);
            container.innerHTML = filtered.length === 0 ? `<span style="color: var(--text-muted); font-size: 0.8rem; padding: 4px;">No models starting with '${modelLetterFilter}'</span>` : '';

            filtered.forEach(model => {
                const tag = document.createElement('div');
                tag.className = `tag-pill ${selectedModels.includes(model.name) ? 'selected' : ''}`;
                tag.textContent = model.name;
                tag.onclick = () => {
                    selectedModels = selectedModels.includes(model.name) ? selectedModels.filter(m => m !== model.name) : [...selectedModels, model.name];
                    renderModelTags();
                    renderFolderTags();
                };
                container.appendChild(tag);
            });
        }

        function renderFolderTags() {
            const container = document.getElementById('folderTagsList');
            const azBar = document.getElementById('folderAZBar');

            if (selectedModels.length === 0) {
                container.innerHTML = `<span style="color: var(--text-muted); font-size: 0.8rem; padding: 4px;">Select a model first to view its folders</span>`;
                if (azBar) azBar.innerHTML = '';
                selectedFolders = [];
                return;
            }

            const allFoldersDB = (typeof ImageStorageDB !== 'undefined') ? (ImageStorageDB.getFolders() || []) : [];
            const foldersSet = new Set();
            selectedModels.forEach(modelName => {
                allFoldersDB.filter(f => f.model && f.model.toLowerCase() === modelName.toLowerCase()).forEach(f => {
                    const fName = typeof f === 'string' ? f : (f.name || f.title);
                    if (fName) foldersSet.add(fName.trim());
                });
            });

            const folders = Array.from(foldersSet).sort((a, b) => a.localeCompare(b));
            if (folders.length === 0) {
                container.innerHTML = `<span style="color: var(--text-muted); font-size: 0.8rem; padding: 4px;">No folders found for this model</span>`;
                if (azBar) azBar.innerHTML = '';
                selectedFolders = [];
                return;
            }

            selectedFolders = selectedFolders.filter(f => folders.includes(f));
            buildAZBar('folderAZBar', folders, folderLetterFilter, (l) => { folderLetterFilter = l; renderFolderTags(); });

            const filtered = folderLetterFilter === 'ALL' ? folders : folders.filter(f => f.trim().charAt(0).toUpperCase() === folderLetterFilter);
            container.innerHTML = filtered.length === 0 ? `<span style="color: var(--text-muted); font-size: 0.8rem; padding: 4px;">No folders starting with '${folderLetterFilter}'</span>` : '';

            filtered.forEach(folderName => {
                const tag = document.createElement('div');
                tag.className = `tag-pill ${selectedFolders.includes(folderName) ? 'selected' : ''}`;
                tag.textContent = folderName;
                tag.onclick = () => {
                    selectedFolders = selectedFolders.includes(folderName) ? selectedFolders.filter(f => f !== folderName) : [...selectedFolders, folderName];
                    renderFolderTags();
                };
                container.appendChild(tag);
            });
        }
    </script>
</body>
</html>
