<!DOCTYPE html>
<html lang="en"><head>
    <!-- Authentication Guard -->
    <script>
        if (sessionStorage.getItem('portal_authenticated') !== 'true') {
            alert('Access Denied: Please log in first.');
            window.location.href = 'login.html';
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Stream - Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .nav-bar-compact {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2px;
            margin-bottom: 24px;
            max-width: 1650px;
            margin-left: auto;
            margin-right: auto;
        }

        .mondrian-nav-box {
            height: 52px !important;
            font-size: 0.85rem !important;
            border-radius: 12px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: #fff;
            border: 1px solid var(--card-border);
            text-decoration: none;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .mondrian-nav-box:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        /* Layout Container with 2px gap matching photostream.html */
        .stream-layout-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2px;
            align-items: stretch;
            max-width: 1650px;
            margin-left: auto;
            margin-right: auto;
        }

        .control-panel {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .preview-wrapper {
            height: 100%;
            display: flex;
        }

        .live-thumb-preview-box {
            width: 100%;
            height: 100%;
            min-height: 480px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }

        /* Tag Section Wrapper */
        .tag-section-wrapper {
            margin-bottom: 16px;
        }

        .tag-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .tag-section-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* A-Z Alphabet Quick-Jump / Filter Bar */
        .az-bar {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            padding: 4px 0;
            margin-bottom: 8px;
            scrollbar-width: none;
        }
        .az-bar::-webkit-scrollbar {
            display: none;
        }

        .az-letter {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
            user-select: none;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .az-letter:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .az-letter.active {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        .az-letter.disabled {
            opacity: 0.2;
            cursor: default;
            pointer-events: none;
        }

        /* Scrollable Tags Container */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            max-height: 120px;
            overflow-y: auto;
            padding: 8px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: var(--text-muted) rgba(0,0,0,0.3);
        }

        .tags-container::-webkit-scrollbar {
            width: 6px;
        }

        .tags-container::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.3);
            border-radius: 6px;
        }

        .tags-container::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 6px;
        }

        .tag-pill {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tag-pill.selected {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        @media (max-width: 900px) {
            .stream-layout-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="site-container">
        <!-- Compact Top Nav Bar with Home and Models matching index.html -->
        <div class="nav-bar-compact">
            <a href="index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="models.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Models</div></a>
        </div>

        <div class="stream-layout-container">
            <div class="control-panel">
                <div>
                    <h2 style="font-size: 1.25rem; font-weight: 800; margin-bottom: 20px;">Add New Stream</h2>
                    <form id="streamForm">
                        <div style="margin-bottom: 16px;">
                            <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Stream Title</label>
                            <input type="text" id="streamTitle" required="" placeholder="Enter stream title">
                        </div>
                        <div style="margin-bottom: 16px;">
                            <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Stream URL</label>
                            <input type="text" id="streamUrl" required="" placeholder="https://www.youtube.com/watch?v=...">
                        </div>
                        <div style="margin-bottom: 16px;">
                            <label style="display:block; font-size:0.85rem; font-weight:600; color:var(--text-muted); margin-bottom:6px;">Thumbnail URL (Optional)</label>
                            <input type="text" id="streamThumbnail" placeholder="Leave blank for auto YouTube thumb">
                        </div>

                        <!-- Models Tagging Section (Advanced Photostream A-Z Bar Feature) -->
                        <div class="tag-section-wrapper">
                            <div class="tag-section-header">
                                <span class="tag-section-title">Tag Models</span>
                            </div>
                            <div class="az-bar" id="modelAZBar"></div>
                            <div class="tags-container" id="modelTagsList"></div>
                        </div>

                        <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Save Stream</button>
                    </form>
                </div>
            </div>
            <div class="preview-wrapper">
                <div class="live-thumb-preview-box" id="previewContainer"><span style="color: var(--text-muted);">Thumbnail Preview</span></div>
            </div>
        </div>
    </div>

    <!-- Integrated Config, Storage & GitHub Sync Scripts -->
    <script src="config.js"></script>
    <script src="scripts/modelstorage.js"></script>
    <script src="storage.js"></script>
    <script src="github-sync.js"></script>
    <script>
        let selectedModels = [];
        let modelLetterFilter = 'ALL';

        function buildAZBar(barContainerId, itemsList, currentFilter, onSelectLetter) {
            const azBar = document.getElementById(barContainerId);
            if (!azBar) return;
            azBar.innerHTML = '';

            const availableLetters = new Set(
                itemsList.map(item => {
                    const name = typeof item === 'string' ? item : (item.name || item.title);
                    return name ? name.trim().charAt(0).toUpperCase() : '';
                })
            );

            const allBtn = document.createElement('span');
            allBtn.className = `az-letter ${currentFilter === 'ALL' ? 'active' : ''}`;
            allBtn.textContent = 'ALL';
            allBtn.onclick = () => onSelectLetter('ALL');
            azBar.appendChild(allBtn);

            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
            alphabet.forEach(letter => {
                const span = document.createElement('span');
                span.className = 'az-letter';
                span.textContent = letter;

                if (currentFilter === letter) {
                    span.classList.add('active');
                }

                if (!availableLetters.has(letter)) {
                    span.classList.add('disabled');
                } else {
