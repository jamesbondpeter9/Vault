<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Stream - Portal</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .nav-bar-compact {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 2px;
            margin-bottom: 20px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .mondrian-nav-box {
            height: 52px !important;
            font-size: 0.85rem !important;
            border-radius: 12px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: #fff;
            border: 1px solid var(--card-border);
            text-decoration: none;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            transition: all 0.2s ease;
        }
        .mondrian-nav-box:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }
    </style>
</head>
<body>
    <div class="site-container">
        <div class="nav-bar-compact">
            <a href="index.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Home</div></a>
            <a href="models.html" class="mondrian-nav-card"><div class="mondrian-nav-box">Models</div></a>
        </div>

        <div style="max-width: 800px; margin: 0 auto;">
            <div class="control-panel" style="padding: 32px;">
                <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 24px; color: #fff;">Add New Video Stream</h1>
                
                <div style="display: flex; flex-direction: column; gap: 16px;">
                    <div>
                        <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; color: var(--text-muted);">Stream Title</label>
                        <input type="text" id="streamTitle" placeholder="Enter video title" style="width: 100%; padding: 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--card-border); color: #fff; border-radius: 12px; box-sizing: border-box;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; color: var(--text-muted);">Stream URL / Embed / YouTube Link</label>
                        <input type="text" id="streamUrl" placeholder="https://..." style="width: 100%; padding: 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--card-border); color: #fff; border-radius: 12px; box-sizing: border-box;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; color: var(--text-muted);">Thumbnail Image URL</label>
                        <input type="text" id="streamThumb" placeholder="https://..." style="width: 100%; padding: 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--card-border); color: #fff; border-radius: 12px; box-sizing: border-box;">
                    </div>
                    <div>
                        <label style="display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; color: var(--text-muted);">Tag Models (Comma separated or select)</label>
                        <input type="text" id="streamModels" placeholder="Jasmine Sherni, Eva Elfie" style="width: 100%; padding: 14px; background: rgba(0,0,0,0.5); border: 1px solid var(--card-border); color: #fff; border-radius: 12px; box-sizing: border-box;">
                    </div>
                    <button onclick="saveNewStream()" class="btn-primary" style="width: 100%; padding: 16px; margin-top: 10px; font-size: 1rem; font-weight: 800;">Save Stream</button>
                </div>
            </div>
        </div>
    </div>

    <script src="storage.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await StorageDB.initDB();
        });

        function saveNewStream() {
            const title = document.getElementById('streamTitle').value.trim();
            const url = document.getElementById('streamUrl').value.trim();
            const thumbnail = document.getElementById('streamThumb').value.trim();
            const modelsRaw = document.getElementById('streamModels').value.trim();

            if (!title || !url) {
                alert('Please provide at least a title and a stream URL.');
                return;
            }

            const models = modelsRaw ? modelsRaw.split(',').map(m => m.trim()).filter(Boolean) : [];

            StorageDB.addVideoStream({
                title,
                url,
                thumbnail,
                models
            });

            alert('Stream successfully saved!');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
